name: 3D Lite Clean Rewrite Gate

on:
  push:
    branches: [3dlite-clean-rewrite-l3n]
    paths:
      - 'rewrite/**'
      - '.github/workflows/3dlite-clean-rewrite-gate.yml'
  pull_request:
    paths:
      - 'rewrite/**'
      - '.github/workflows/3dlite-clean-rewrite-gate.yml'

jobs:
  core-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax gate
        run: |
          set -euo pipefail
          find rewrite/src rewrite/tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Main Core smoke gate
        run: node rewrite/tests/core-smoke.mjs
      - name: Viewport boundary smoke gate
        run: node rewrite/tests/viewport-smoke.mjs
      - name: LitePix renderer port smoke gate
        run: node rewrite/tests/litepix-port-smoke.mjs
      - name: Async task and worker smoke gate
        run: node rewrite/tests/async-task-smoke.mjs
      - name: Architecture gate
        run: |
          set -euo pipefail
          test -f rewrite/src/core/main-core.mjs
          test -f rewrite/src/core/command-stack.mjs
          test -f rewrite/src/core/generation-registry.mjs
          test -f rewrite/src/core/resource-store.mjs
          test -f rewrite/src/core/task-system.mjs
          test -f rewrite/src/core/worker-pool.mjs
          test -f rewrite/src/core/scene-entity.mjs
          test -f rewrite/src/core/scene-graph.mjs
          test -f rewrite/src/core/editable-mesh.mjs
          test -f rewrite/src/core/geometry-store.mjs
          test -f rewrite/src/core/edit-selection.mjs
          test -f rewrite/src/core/geometry-commands.mjs
          test -f rewrite/src/core/entity-commands.mjs
          test -f rewrite/src/core/evaluation-graph.mjs
          test -f rewrite/src/core/evaluator.mjs
          test -f rewrite/src/core/modifier-stack.mjs
          test -f rewrite/src/core/modifier-commands.mjs
          test -f rewrite/src/core/asset-store.mjs
          test -f rewrite/src/core/material-store.mjs
          test -f rewrite/src/core/material-commands.mjs
          test -f rewrite/src/ports/render-scene-port.mjs
          test -f rewrite/src/ports/viewport-port.mjs
          test -f rewrite/src/ports/viewport-scene-adapter.mjs
          test -f rewrite/src/ports/litepix-scene-adapter.mjs
          test -f rewrite/src/ports/litepix-renderer-port.mjs
          test -f rewrite/index.html
          test "$(grep -R "new ThreeDLiteMainCore" -n rewrite/src | wc -l)" -eq 1
          ! grep -R "window\.scene\|window\.objects\|window\.camera" -n rewrite/src
          ! grep -R "\.scene\.register\|\.scene\.reparent\|\.scene\.unregister" -n rewrite/src --exclude='main-core.mjs'
          ! grep -R "\.geometry\.create\|\.geometry\.update\|\.geometry\.destroy" -n rewrite/src --exclude='main-core.mjs' --exclude='geometry-store.mjs'
          ! grep -R "positions\[[^]]*\][[:space:]]*=" -n rewrite/src --exclude='main-core.mjs' --exclude='geometry-store.mjs' --exclude='geometry-commands.mjs' --exclude='editable-mesh.mjs'
          ! grep -R "modifiers\.push\|modifiers\.splice\|modifiers\[[^]]*\][[:space:]]*=" -n rewrite/src --exclude='modifier-commands.mjs' --exclude='modifier-stack.mjs'
          ! grep -R "\.materials\.create\|\.materials\.update\|\.materials\.destroy" -n rewrite/src --exclude='main-core.mjs' --exclude='material-store.mjs'
          ! grep -R "\.assets\.create\|\.assets\.update\|\.assets\.destroy" -n rewrite/src --exclude='main-core.mjs' --exclude='asset-store.mjs'
          ! grep -R "\.entities\.update\|\.entities\.create\|\.entities\.destroy" -n rewrite/src/ports
          ! grep -R "LitePixSceneCompiler\|LitePixCore8Production443" -n rewrite/src --exclude='litepix-renderer-port.mjs'
          ! grep -R "postMessage\|new Worker" -n rewrite/src/core --exclude='worker-pool.mjs'
