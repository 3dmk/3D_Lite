name: 3D Lite DCAMP Full Migration Gate
on:
  push:
    branches: [3dlite-dcamp-full-migration]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Apply DCAMP integration
        run: python3 patches/3dlite/dcamp-full/apply-dcamp-v2.py
      - name: Generate structural sheet and function registry
        run: python3 tools/architecture/scan_3dlite.py
      - name: Structural and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check 3dlite/main-core-v1.js
          node --check 3dlite/main-core-v2.js
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('index.html').read_text(encoding='utf-8')
          req=['./3dlite/main-core-v1.js','./3dlite/main-core-v2.js','threeDLiteMainCore:window.ThreeDLiteMainCore?.renderStamp?.()||null','threeDLiteArchitecture:window.ThreeDLiteMainCore?.status?.()||null']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          ids=re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',s,re.I)
          if len(ids)!=len(set(ids)): raise SystemExit('duplicate ids found')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',s,re.I)
          if any(re.search(r'\bsrc\s*=',a) and b.strip() for a,b in scripts): raise SystemExit('external script inline body found')
          if len(re.findall(r'requestAnimationFrame\s*\(\s*animate\s*\)',s))!=1: raise SystemExit('animation loop owner mismatch')
          report=json.loads(Path('reports/3dlite/dcamp-structure-inventory.json').read_text())
          if report['startup']['duplicateIds'] or report['startup']['externalScriptInlineBodies'] or report['startup']['animationLoopStarts']!=1: raise SystemExit('scanner startup gate failed')
          print('DCAMP structural gate passed')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser architecture and renderer regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/dcamp-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/dcamp-gate.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(2200);
            const architecture=await page.evaluate(()=>{
              const core=window.ThreeDLiteMainCore;if(!core)return {missing:true};
              const box={x:1};
              const off=core.registerCommand('gate.move',{execute:(_,v)=>{const before=box.x;box.x=v;return {value:box.x,dirty:['transform'],undo:()=>{box.x=before},redo:()=>{box.x=v}};}});
              const commandValue=core.executeCommand('gate.move',5);const afterCommand=box.x;const undoOK=core.undo(),afterUndo=box.x;const redoOK=core.redo(),afterRedo=box.x;off();
              let computes=0;const d1=core.derive('gate-derived',['transform'],()=>++computes);const d2=core.derive('gate-derived',['transform'],()=>++computes);core.dirty('transform');const d3=core.derive('gate-derived',['transform'],()=>++computes);
              const h1=core.createResource('gate',{value:1});const h2=core.updateResource(h1,{value:2});const stale=core.getResource(h1),fresh=core.getResource(h2);const released=core.releaseResource(h2);
              const toolLog=[];let t=core.beginTool('gate-tool',{begin:()=>toolLog.push('begin'),update:()=>toolLog.push('update'),preview:()=>toolLog.push('preview'),commit:()=>{toolLog.push('commit');return 7},cancel:()=>toolLog.push('cancel')});t.update();t.preview();const toolValue=t.commit();
              const t2=core.beginTool('gate-cancel',{cancel:()=>toolLog.push('cancel')});const cancelOK=t2.cancel();
              const env=core.projectEnvelope({kind:'gate'}),view=core.renderSceneView(),status=core.status();
              return {missing:false,marker:window.__3DLiteMainCoreV2===true,architectureVersion:core.architectureVersion,architecture:core.architecture,mode:core.mode,commandValue,afterCommand,undoOK,afterUndo,redoOK,afterRedo,derived:[d1,d2,d3],computes,resource:{stale,fresh,released},toolLog,toolValue,cancelOK,envelope:{schema:env.schema,application:env.application,mainCore:env.mainCore,litePix:env.litePix},view:{scene:!!view.scene,objects:Array.isArray(view.objects),camera:!!view.camera},status,canvasCount:document.querySelectorAll('canvas').length,title:document.title};
            });
            const render=await page.evaluate(async()=>{
              for(const o of [...scene.children])if(o?.isMesh||o?.isLight){scene.remove(o);try{o.geometry?.dispose?.();}catch(_){} }
              objects.length=0;
              const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,100,1,1),new THREE.MeshStandardMaterial({color:0x888888,roughness:.75}));floor.position.set(0,0,0);scene.add(floor);objects.push(floor);
              const box=new THREE.Mesh(new THREE.BoxGeometry(28,28,28),new THREE.MeshStandardMaterial({color:0xa76a45,roughness:.45}));box.position.set(0,0,14);scene.add(box);objects.push(box);
              const light=new THREE.PointLight(0xffffff,1200,220,2);light.position.set(-30,-25,60);light.castShadow=true;scene.add(light);
              camera.position.set(80,-110,72);camera.up.set(0,0,1);camera.lookAt(0,0,10);camera.updateMatrixWorld(true);camera.updateProjectionMatrix();
              window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;window.__3DLiteGeometryRevision=(window.__3DLiteGeometryRevision||0)+1;
              window.ThreeDLiteMainCore?.syncLegacyRevisions?.();
              const val=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              const chk=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.checked=!!v;e.dispatchEvent(new Event('change',{bubbles:true}));};
              val('rsEngine','path');val('rsWidth',64);val('rsHeight',36);val('rsBounces',2);val('rsMinSamples',2);val('rsMaxSamples',2);val('rsNoise',0.001);val('rsEnvStrength',0);chk('rsGI',true);chk('rsAdaptive',false);
              const prior=RenderFramework?.jobs?.lastJob?.id||0;document.getElementById('renderNowBtn').click();let job=null;const deadline=performance.now()+90000;
              while(performance.now()<deadline){await new Promise(r=>setTimeout(r,30));const j=RenderFramework.jobs.lastJob;if(j&&j.id!==prior&&j.finished&&j.performance){job=j;break;}}
              if(!job)throw new Error('render timeout');const meta=job.beautyFrame?.metadata||{};
              return {performance:meta.performance||job.performance,secondaryGI:meta.secondaryGI||null,rayBudget:meta.litePixRayBudget||null,mainCore:meta.threeDLiteMainCore||null,architecture:meta.threeDLiteArchitecture||null,core2:meta.litePixCore2Production||null};
            });
            const failures=[];
            if(response?.status()!==200)failures.push('HTTP != 200');
            if(architecture.missing||!architecture.marker||architecture.architectureVersion!=='2.0.0'||architecture.architecture!=='DCAMP')failures.push('Main Core v2 identity failed');
            if(architecture.afterCommand!==5||!architecture.undoOK||architecture.afterUndo!==1||!architecture.redoOK||architecture.afterRedo!==5)failures.push('command undo/redo failed');
            if(architecture.computes!==2||architecture.derived[0]!==architecture.derived[1]||architecture.derived[2]===architecture.derived[1])failures.push('derived generation cache failed');
            if(architecture.resource.stale!==null||architecture.resource.fresh?.value!==2||!architecture.resource.released)failures.push('generational resource handles failed');
            if(architecture.toolValue!==7||!architecture.cancelOK||architecture.toolLog.join(',')!=='begin,update,preview,commit,cancel')failures.push('tool lifecycle failed');
            if(!architecture.view.scene||!architecture.view.objects||!architecture.view.camera)failures.push('legacy domain view failed');
            if((architecture.canvasCount||0)<1)failures.push('viewport missing');
            if(!render.mainCore||!render.architecture||render.architecture.architectureVersion!=='2.0.0')failures.push('render boundary Main Core metadata missing');
            if(render.secondaryGI!=='Light Cache')failures.push('Light Cache inactive');
            if(!render.rayBudget||render.rayBudget.version!=='4.45.0')failures.push('LitePix v4.45 ray budget missing');
            if(!render.core2)failures.push('LitePix Core2 missing');
            if(pageErrors.length)failures.push('page errors '+pageErrors.length);if(consoleErrors.length)failures.push('console errors '+consoleErrors.length);
            const out={passed:!failures.length,architecture,render,pageErrors,consoleErrors,failures};console.log(JSON.stringify(out,null,2));await browser.close();if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save DCAMP gate report
        if: success()
        run: |
          mkdir -p reports/3dlite
          cp /tmp/dcamp-gate.json reports/3dlite/dcamp-full-gate.json
      - name: Commit generated/gated results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3D Lite DCAMP Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html reports/3dlite/dcamp-full-gate.json reports/3dlite/dcamp-structure-inventory.json docs/architecture/STRUCTURAL_SHEET_CURRENT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Gate 3D Lite DCAMP Main Core v2 and structural inventory'
            git push origin HEAD:3dlite-dcamp-full-migration
          fi
