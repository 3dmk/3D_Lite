name: 3D Lite Main Core v1 Gate
on:
  push:
    branches: [3dlite-main-core-v1]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Apply Main Core integration
        run: python3 patches/3dlite/main-core-v1/apply-main-core.py
      - name: Structural and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check 3dlite/main-core-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          req=['./3dlite/main-core-v1.js','threeDLiteMainCore:window.ThreeDLiteMainCore?.renderStamp?.()||null','window.ThreeDLiteMainCore?.syncLegacyRevisions?.();']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          ids=re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',s,re.I)
          if len(ids)!=len(set(ids)): raise SystemExit('duplicate ids found')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',s,re.I)
          if any(re.search(r'\bsrc\s*=',a) and b.strip() for a,b in scripts): raise SystemExit('external script inline body found')
          if len(re.findall(r'requestAnimationFrame\s*\(\s*animate\s*\)',s))!=1: raise SystemExit('animation loop owner mismatch')
          print('3D Lite Main Core v1 structural gate passed')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser Main Core behavior gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/maincore-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/maincore-v1.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>{
              const core=window.ThreeDLiteMainCore;
              if(!core) return {missing:true};
              const before=core.generations();
              const beforeLegacy=Number(window.__3DLiteSceneRevision)||0;
              const value=core.transaction('gate-commit',()=>({value:42,dirty:['transform']}),v=>v===42);
              const after=core.generations();
              const afterLegacy=Number(window.__3DLiteSceneRevision)||0;
              const box={x:1};let rollbackCaught=false;
              try{core.transaction('gate-rollback',()=>{box.x=9;return {value:box.x,undo:()=>{box.x=1},dirty:['geometry']};},()=>false);}catch(_){rollbackCaught=true;}
              let nestedRejected=false;
              try{core.transaction('outer',()=>{core.transaction('inner',()=>1);return 1;});}catch(_){nestedRejected=true;}
              const canvasCount=document.querySelectorAll('canvas').length;
              return {missing:false,marker:window.__3DLiteMainCoreV1===true,version:core.version,mode:core.mode,value,before,after,beforeLegacy,afterLegacy,rollbackCaught,rollbackValue:box.x,nestedRejected,status:core.status(),stamp:core.renderStamp(),canvasCount,title:document.title};
            });
            const failures=[];
            if(response?.status()!==200)failures.push('HTTP != 200');
            if(result.missing||!result.marker||result.version!=='1.0.0')failures.push('Main Core identity missing');
            if(result.value!==42||!(result.after.transform>result.before.transform))failures.push('committed transaction/generation failed');
            if(!(result.afterLegacy>=result.beforeLegacy))failures.push('legacy revision bridge regressed');
            if(!result.rollbackCaught||result.rollbackValue!==1)failures.push('rollback failed');
            if(!result.nestedRejected)failures.push('nested transaction guard failed');
            if((result.canvasCount||0)<1)failures.push('viewport canvas missing');
            if(pageErrors.length)failures.push('page errors '+pageErrors.length);
            if(consoleErrors.length)failures.push('console errors '+consoleErrors.length);
            const out={passed:!failures.length,result,pageErrors,consoleErrors,failures};
            console.log(JSON.stringify(out,null,2));
            await browser.close();
            if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save gate report
        if: success()
        run: |
          mkdir -p reports/3dlite
          cp /tmp/maincore-v1.json reports/3dlite/main-core-v1-report.json
      - name: Commit gated build
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3D Lite Main Core Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html reports/3dlite/main-core-v1-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Gate 3D Lite Main Core v1 foundation'
            git push origin HEAD:3dlite-main-core-v1
          fi
