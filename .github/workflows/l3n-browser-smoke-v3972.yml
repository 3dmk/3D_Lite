name: L3N Browser Smoke v3.97.2
on:
  push:
    branches: [l3n-dev]
    paths: ['.l3n-browser-smoke-v3972-trigger']
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/3dlite-http.log 2>&1 &
      - name: Browser runtime verification
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:800}});
            const pageErrors=[], consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||!response.ok())throw new Error('HTTP load failed');
            await page.waitForTimeout(3000);
            const state=await page.evaluate(()=>({
              title:document.title,
              version:window.ThreeDLiteVersion?.version||null,
              publicLabel:document.getElementById('threeDLitePublicVersion')?.textContent||'',
              viewport:!!document.getElementById('viewport'),
              canvas:!!document.querySelector('#viewport canvas'),
              rendered:document.documentElement.dataset.viewportRendered||null,
              three:!!window.THREE,
              rendererState:window.RendererRuntimeState?.snapshot?.()||null,
              deep:window.__3DLiteL3NDeepIntegration||null
            }));
            console.log(JSON.stringify({state,pageErrors,consoleErrors},null,2));
            const failures=[];
            if(state.version!=='3.97.2'||!state.title.includes('3DLite v3.97.2')||!state.publicLabel.includes('3.97.2'))failures.push('version identity');
            if(!state.viewport||!state.canvas||state.rendered!=='true'||!state.three)failures.push('viewport/runtime');
            if(pageErrors.length)failures.push('page errors: '+pageErrors.join(' | '));
            const rendererValidation=consoleErrors.filter(x=>x.includes('[3DLite Renderer] validation'));
            if(rendererValidation.length)failures.push('renderer validation errors: '+rendererValidation.join(' | '));
            if(state.rendererState?.degraded)failures.push('renderer degraded');
            if(state.deep?.regression?.passed===false)failures.push('L3N regression failed');
            if(failures.length){await browser.close();throw new Error(failures.join('; '));}
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
