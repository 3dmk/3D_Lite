name: L3N v3.97.4 Browser Smoke
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-browser-smoke-v3974-trigger'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start server
        run: |
          python3 -m http.server 8000 >/tmp/3dlite-http.log 2>&1 &
          sleep 2
      - name: Runtime smoke
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage();
            const pageErrors=[];
            const rendererErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{const t=m.text(); if(t.includes('[3DLite Renderer] validation')) rendererErrors.push(t);});
            const r=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            if(!r || !r.ok()) throw new Error('HTTP load failed');
            await page.waitForTimeout(5000);
            const result=await page.evaluate(()=>{
              const guard=window.ThreeDLiteMaterialIndexGuard;
              if(!guard) throw new Error('missing material index guard');
              const g=new THREE.BoxGeometry(2,2,2);
              g.clearGroups();
              g.addGroup(0,g.index.count,7);
              const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial());
              m.name='MaterialGuardSmoke';
              const before=guard.inspect(m);
              if(before.valid) throw new Error('invalid group not detected');
              const fixed=guard.repairObject(m,'browser-smoke');
              const after=guard.inspect(m);
              const snap=window.ThreeDLiteL3NDebugRegistry?.snapshot?.();
              m.geometry.dispose();m.material.dispose();
              return {
                title:document.title,
                publicVersion:window.ThreeDLiteVersion?.version,
                apiVersion:window.ThreeDLiteBrowserTestAPI?.version,
                liveVersion:window.__3DLiteLiveBuild?.version,
                buildVersion:window.ThreeDLiteBuildIdentity?.version,
                guardVersion:guard.version,
                repaired:fixed.repaired,
                repairedTo:fixed.repairs?.[0]?.to,
                afterValid:after.valid,
                learned:!!snap?.issues?.some?.(x=>x.subtype==='material-index-out-of-range'),
                viewport:!!document.querySelector('#viewport'),
                canvas:!!document.querySelector('#viewport canvas'),
                frames:window.ThreeDLiteRuntimeTelemetry?.metrics?.frames||0,
                three:!!window.THREE,
                regression:window.ThreeDLiteL3NIntegration?.regression?.()
              };
            });
            console.log(JSON.stringify(result,null,2));
            if(!result.title.includes('3DLite v3.97.4')) throw new Error('wrong title '+result.title);
            for(const [k,v] of Object.entries({publicVersion:result.publicVersion,apiVersion:result.apiVersion,liveVersion:result.liveVersion,buildVersion:result.buildVersion,guardVersion:result.guardVersion})) if(v!=='3.97.4') throw new Error(k+' wrong: '+v);
            if(!result.repaired||result.repairedTo!==0||!result.afterValid) throw new Error('material repair failed');
            if(!result.learned) throw new Error('L3N did not collect material error');
            if(!result.viewport||!result.canvas||!result.three||result.frames<1) throw new Error('viewport/runtime dependency missing');
            if(pageErrors.length) throw new Error('page errors: '+pageErrors.join(' | '));
            if(rendererErrors.length) throw new Error('renderer validation errors: '+rendererErrors.join(' | '));
            if(result.regression && result.regression.passed===false) throw new Error('L3N regression failed: '+JSON.stringify(result.regression));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
