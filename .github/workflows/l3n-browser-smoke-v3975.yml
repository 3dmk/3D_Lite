name: L3N v3.97.5 Browser Smoke
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-browser-smoke-v3975-trigger'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start server
        run: |
          python3 -m http.server 8000 >/tmp/3dlite-http.log 2>&1 &
          sleep 2
      - name: Runtime smoke
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage();
            const pageErrors=[]; const rendererErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{const t=m.text(); if(t.includes('[3DLite Renderer] validation')) rendererErrors.push(t);});
            const r=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            if(!r||!r.ok()) throw new Error('HTTP load failed');
            await page.waitForTimeout(5000);
            const result=await page.evaluate(()=>{
              const d=window.ThreeDLiteL3NRenderDebugger;
              if(!d) throw new Error('missing rendering debugger');
              const codes=window.ThreeDLiteRenderErrorCodes;
              if(!codes||!codes['RND-0101']||!codes['RND-0501']) throw new Error('missing RND error catalog');
              const c1=d.classify('Material index out of range','render');
              const c2=d.classify(new Error('NaN render value'),'render');
              const rep=d.record('RND-0401',{message:'Shadow noise smoke',evidence:{renderId:999,shadowRays:123},status:'resolved'});
              const snap=d.snapshot();
              const l3n=window.ThreeDLiteL3NDebugRegistry?.snapshot?.();
              return {
                title:document.title,
                version:d.version,
                publicVersion:window.ThreeDLiteVersion?.version,
                apiVersion:window.ThreeDLiteBrowserTestAPI?.version,
                liveVersion:window.__3DLiteLiveBuild?.version,
                buildVersion:window.ThreeDLiteBuildIdentity?.version,
                panel:!!document.getElementById('l3nRenderDebugPanel'),
                button:!!document.getElementById('l3nRenderDebugBtn'),
                c1,c2,repCode:rep.code,
                reports:snap.reports.length,
                learned:!!l3n?.issues?.some?.(x=>String(x.message||'').includes('RND-0401')),
                viewport:!!document.querySelector('#viewport'),canvas:!!document.querySelector('#viewport canvas'),
                frames:window.ThreeDLiteRuntimeTelemetry?.metrics?.frames||0,three:!!window.THREE,
                regression:window.ThreeDLiteL3NIntegration?.regression?.()
              };
            });
            console.log(JSON.stringify(result,null,2));
            if(!result.title.includes('3DLite v3.97.5')) throw new Error('wrong title '+result.title);
            for(const [k,v] of Object.entries({version:result.version,publicVersion:result.publicVersion,apiVersion:result.apiVersion,liveVersion:result.liveVersion,buildVersion:result.buildVersion})) if(v!=='3.97.5') throw new Error(k+' wrong '+v);
            if(!result.panel||!result.button) throw new Error('render debug UI missing');
            if(result.c1!=='RND-0501'||result.c2!=='RND-0801'||result.repCode!=='RND-0401'||result.reports<1||!result.learned) throw new Error('render debugger classification/learning failed '+JSON.stringify(result));
            if(!result.viewport||!result.canvas||!result.three||result.frames<1) throw new Error('viewport/runtime dependency missing');
            if(pageErrors.length) throw new Error('page errors: '+pageErrors.join(' | '));
            if(rendererErrors.length) throw new Error('renderer validation errors: '+rendererErrors.join(' | '));
            if(result.regression&&result.regression.passed===false) throw new Error('L3N regression failed '+JSON.stringify(result.regression));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
