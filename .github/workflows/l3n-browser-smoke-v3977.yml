name: L3N v3.97.7 Browser Smoke
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-browser-smoke-v3977-trigger'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start server
        run: |
          python3 -m http.server 8000 >/tmp/3dlite-http.log 2>&1 &
          sleep 2
      - name: Runtime smoke
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage();
            const pageErrors=[];const rendererErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{const t=m.text();if(t.includes('[3DLite Renderer] validation'))rendererErrors.push(t);});
            const r=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForTimeout(5000);
            const result=await page.evaluate(()=>{
              const ui=window.ThreeDLiteRenderDebugListUI;
              const dbg=window.ThreeDLiteL3NCompleteRenderDebugger;
              if(!ui||!dbg)throw new Error('debug APIs missing');
              dbg.record('RND-1194',{message:'selectable list smoke',status:'resolved',renderId:3977,stage:'smoke'});
              const opened=ui.open();
              ui.refresh();
              const ta=document.getElementById('l3nRenderDebugListText');
              if(!ta)throw new Error('list textarea missing');
              const idx=ta.value.indexOf('RND-1194');
              if(idx>=0)ta.setSelectionRange(idx,idx+'RND-1194'.length);
              return {
                title:document.title,
                publicVersion:window.ThreeDLiteVersion?.version,
                apiVersion:window.ThreeDLiteBrowserTestAPI?.version,
                liveVersion:window.__3DLiteLiveBuild?.version,
                buildVersion:window.ThreeDLiteBuildIdentity?.version,
                uiVersion:ui.version,
                debugVersion:dbg.version,
                opened,
                button:!!document.getElementById('l3nRenderDebugListBtn'),
                panel:document.getElementById('l3nRenderDebugListWindow')?.style.display,
                readOnly:ta.readOnly,
                containsCode:ta.value.includes('RND-1194'),
                containsMessage:ta.value.includes('selectable list smoke'),
                selection:ta.value.slice(ta.selectionStart,ta.selectionEnd),
                copySelectedButton:!!document.getElementById('l3nRenderDebugCopySelected'),
                copyAllButton:!!document.getElementById('l3nRenderDebugCopyAll'),
                canvas:!!document.querySelector('#viewport canvas'),
                three:!!window.THREE,
                frames:window.ThreeDLiteRuntimeTelemetry?.metrics?.frames||0,
                regression:window.ThreeDLiteL3NIntegration?.regression?.()
              };
            });
            console.log(JSON.stringify(result,null,2));
            if(!result.title.includes('3DLite v3.97.7'))throw new Error('wrong title '+result.title);
            for(const [k,v] of Object.entries({publicVersion:result.publicVersion,apiVersion:result.apiVersion,liveVersion:result.liveVersion,buildVersion:result.buildVersion,uiVersion:result.uiVersion,debugVersion:result.debugVersion})) if(v!=='3.97.7')throw new Error(k+' wrong '+v);
            if(!result.opened||!result.button||result.panel!=='block'||!result.readOnly||!result.containsCode||!result.containsMessage||result.selection!=='RND-1194'||!result.copySelectedButton||!result.copyAllButton)throw new Error('render debug list UI failed '+JSON.stringify(result));
            if(!result.canvas||!result.three||result.frames<1)throw new Error('runtime dependency missing');
            if(pageErrors.length)throw new Error('page errors: '+pageErrors.join(' | '));
            if(rendererErrors.length)throw new Error('renderer validation errors: '+rendererErrors.join(' | '));
            if(result.regression&&result.regression.passed===false)throw new Error('L3N regression failed '+JSON.stringify(result.regression));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
