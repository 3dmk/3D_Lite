name: L3N v3.97.8 Browser Smoke
on:
  push:
    branches: [l3n-dev]
    paths: ['.l3n-browser-smoke-v3978-trigger']
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start server
        run: |
          python3 -m http.server 8000 >/tmp/3dlite-http.log 2>&1 &
          sleep 2
      - name: Runtime smoke with real Render click
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const rendererValidation=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{const t=m.text(); if(t.includes('[3DLite Renderer] validation'))rendererValidation.push(t);});
            const r=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForTimeout(4500);
            const pre=await page.evaluate(()=>({
              title:document.title,
              publicVersion:window.ThreeDLiteVersion?.version,
              apiVersion:window.ThreeDLiteBrowserTestAPI?.version,
              liveVersion:window.__3DLiteLiveBuild?.version,
              buildVersion:window.ThreeDLiteBuildIdentity?.version,
              debugVersion:window.ThreeDLiteL3NCompleteRenderDebugger?.version,
              listVersion:window.ThreeDLiteRenderDebugListUI?.version,
              context:!!window.LiteTraceExecutionContext,
              activeJob:window.LiteTraceExecutionContext?.activeJob??null,
              perf:window.LiteTraceExecutionContext?.performance??null,
              rnd1104:window.ThreeDLiteRenderErrorCodes?.['RND-1104']?.name,
              rnd1194:window.ThreeDLiteRenderErrorCodes?.['RND-1194']?.name,
              canvas:!!document.querySelector('#viewport canvas'),three:!!window.THREE,frames:window.ThreeDLiteRuntimeTelemetry?.metrics?.frames||0,
              buttons:[...document.querySelectorAll('button')].map(b=>({text:(b.textContent||'').trim(),id:b.id||'',title:b.title||'',visible:!!(b.offsetWidth||b.offsetHeight||b.getClientRects().length)})).filter(x=>/render/i.test(x.text+' '+x.id+' '+x.title)).slice(0,30)
            }));
            console.log('PRE',JSON.stringify(pre,null,2));
            if(!pre.context)throw new Error('LiteTraceExecutionContext missing');
            if(pre.rnd1104!=='Render execution failure')throw new Error('RND-1104 meaning changed: '+pre.rnd1104);
            if(pre.rnd1194!=='Unknown / unregistered render error')throw new Error('RND-1194 meaning changed: '+pre.rnd1194);
            const clicked=await page.evaluate(()=>{
              const bs=[...document.querySelectorAll('button')];
              const b=bs.find(x=>(x.textContent||'').trim()==='Render' && !x.disabled) || bs.find(x=>/render/i.test((x.textContent||'').trim())&&!/debug|close|cancel|stop/i.test((x.textContent||'').trim())&&!x.disabled);
              if(!b)return null; b.click(); return {text:(b.textContent||'').trim(),id:b.id||'',title:b.title||''};
            });
            console.log('CLICKED',JSON.stringify(clicked));
            if(!clicked)throw new Error('No Render button found');
            await page.waitForTimeout(7000);
            const post=await page.evaluate(()=>{
              const dbg=window.ThreeDLiteL3NCompleteRenderDebugger?.snapshot?.();
              const base=window.ThreeDLiteL3NRenderDebugger?.snapshot?.();
              const events=[...(dbg?.events||[]),...(dbg?.base?.reports||[]),...(base?.reports||[])];
              const missing=events.filter(e=>e?.code==='RND-1104'&&/LiteTraceExecutionContext is not defined/i.test(String(e?.message||'')));
              const jobs=window.RenderFramework?.jobs;
              const aj=jobs?.activeJob||null, lj=jobs?.lastJob||null;
              return {missingCount:missing.length,activeStatus:aj?.status||aj?.progress?.status||null,lastStatus:lj?.status||lj?.progress?.status||null,lastError:String(lj?.error?.message||lj?.error||aj?.error?.message||aj?.error||''),context:!!window.LiteTraceExecutionContext,contextHasActive:'activeJob' in window.LiteTraceExecutionContext,contextHasPerformance:'performance' in window.LiteTraceExecutionContext,frames:window.ThreeDLiteRuntimeTelemetry?.metrics?.frames||0,regression:window.ThreeDLiteL3NIntegration?.regression?.()};
            });
            console.log('POST',JSON.stringify(post,null,2));
            const expected='3.97.8';
            for(const [k,v] of Object.entries({publicVersion:pre.publicVersion,apiVersion:pre.apiVersion,liveVersion:pre.liveVersion,buildVersion:pre.buildVersion,debugVersion:pre.debugVersion,listVersion:pre.listVersion})) if(v!==expected)throw new Error(k+' wrong '+v);
            if(!pre.title.includes('3DLite v3.97.8'))throw new Error('wrong title '+pre.title);
            if(!pre.canvas||!pre.three||pre.frames<1)throw new Error('runtime dependency missing');
            if(!post.context||!post.contextHasActive||!post.contextHasPerformance)throw new Error('execution context contract failed');
            if(post.missingCount)throw new Error('LiteTraceExecutionContext ReferenceError still recorded');
            if(/LiteTraceExecutionContext is not defined/i.test(post.lastError))throw new Error('render still fails: '+post.lastError);
            if(pageErrors.some(e=>/LiteTraceExecutionContext is not defined/i.test(e)))throw new Error('page reference error: '+pageErrors.join(' | '));
            if(rendererValidation.length)throw new Error('renderer validation errors: '+rendererValidation.join(' | '));
            if(post.regression&&post.regression.passed===false)throw new Error('L3N regression failed '+JSON.stringify(post.regression));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
