name: L3N v3.98.0 Browser Render Smoke
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-browser-smoke-v3980-trigger'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local server
        run: python3 -m http.server 8000 >/tmp/3dlite-server.log 2>&1 &
      - name: Run real render smoke
        run: |
          cat > /tmp/smoke3980.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[]; const badConsole=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{const t=m.text(); if(m.type()==='error' && /3DLite Renderer|ReferenceError|TypeError|validation/i.test(t)) badConsole.push(t)});
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'load',timeout:60000});
            await page.waitForFunction(()=>window.RenderBVH&&window.PathIntegrator&&window.ThreeDLiteKernel3980&&window.LiteTraceExecutionContext,{timeout:30000});
            const pre=await page.evaluate(()=>{
              const errs=[];
              const k=window.ThreeDLiteKernel3980;
              if(k.version!=='3.98.0')errs.push('kernel version');
              if(k.parallelRenderer!==false)errs.push('parallel renderer owner');
              const g4=window.runRenderGroup4SelfTests?.(); if(g4&&!g4.ok)errs.push(...g4.errors);
              const t=window.RenderBVH?.toString?.()||'';
              if(!t.includes('binsN=12'))errs.push('12-bin SAH missing');
              if(!t.includes('leafCost'))errs.push('leaf cost test missing');
              const ggx=window.GGXImportanceSampler;
              if(!ggx||typeof ggx.sampleVisibleHalfVector!=='function')errs.push('GGX visible-normal sampler missing');
              if(!window.ThreeDLiteRenderDebugListUI)errs.push('Debug List missing');
              if(!window.ThreeDLiteMaterialIndexGuard)errs.push('Material Index Guard missing');
              const codes=window.ThreeDLiteL3NCompleteRenderDebugger?.codes||window.ThreeDLiteL3NRenderDebugger?.codes||{};
              const c1104=codes['RND-1104']; const c1194=codes['RND-1194'];
              const text1104=JSON.stringify(c1104||{}).toLowerCase(), text1194=JSON.stringify(c1194||{}).toLowerCase();
              if(!text1104.includes('render execution failure'))errs.push('RND-1104 meaning changed');
              if(!(text1194.includes('unknown')&&text1194.includes('render')))errs.push('RND-1194 meaning changed');
              return {errs,k,c1104,c1194,title:document.title,three:!!window.THREE,canvas:!!document.querySelector('canvas')};
            });
            if(pre.errs.length||!pre.three||!pre.canvas)throw new Error('Preflight '+JSON.stringify(pre));
            await page.evaluate(()=>{
              for(const id of ['rsWidth','renderWidth','renderW']){const e=document.getElementById(id);if(e){e.value='64';e.dispatchEvent(new Event('change',{bubbles:true}));}}
              for(const id of ['rsHeight','renderHeight','renderH']){const e=document.getElementById(id);if(e){e.value='64';e.dispatchEvent(new Event('change',{bubbles:true}));}}
              for(const id of ['rsSamples','renderSamples']){const e=document.getElementById(id);if(e){e.value='1';e.dispatchEvent(new Event('change',{bubbles:true}));}}
            });
            const btn=page.getByRole('button',{name:/^Render$/i}).first();
            if(await btn.count()===0)throw new Error('Render button not found');
            await btn.click();
            await page.waitForFunction(()=>{
              const frame=document.getElementById('renderFrameWindow');
              const canvas=document.getElementById('renderCanvas');
              return !!frame&&!!canvas&&canvas.width>0&&canvas.height>0;
            },{timeout:30000});
            await page.waitForTimeout(2500);
            const post=await page.evaluate(()=>{
              const text=window.__3DLiteRenderDebugListText?.()||'';
              const canvas=document.getElementById('renderCanvas');
              return {text,canvas:[canvas?.width||0,canvas?.height||0],ctx:!!window.LiteTraceExecutionContext,kernel:window.ThreeDLiteKernel3980};
            });
            const allErrors=[...pageErrors,...badConsole];
            if(allErrors.some(x=>/LiteTraceExecutionContext is not defined/i.test(x)))throw new Error('Execution context regression '+allErrors.join('\n'));
            if(post.text.includes('LiteTraceExecutionContext is not defined'))throw new Error('RND-1104 execution-context regression');
            if(allErrors.some(x=>/NaN|Infinity/i.test(x)&&/render/i.test(x)))throw new Error('Non-finite render regression '+allErrors.join('\n'));
            if(post.canvas[0]<=0||post.canvas[1]<=0)throw new Error('Render canvas not active '+JSON.stringify(post.canvas));
            if(post.kernel.version!=='3.98.0')throw new Error('Kernel marker lost');
            console.log(JSON.stringify({pre,canvas:post.canvas,pageErrors,badConsole,debugTail:post.text.slice(-1200)},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH=$PWD/node_modules node /tmp/smoke3980.js
