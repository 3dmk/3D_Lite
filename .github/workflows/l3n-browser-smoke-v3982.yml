name: L3N v3.98.2 Light Icon Browser Smoke
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-browser-smoke-v3982-trigger'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Playwright
        run: npm install playwright@1.55.0 && npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8000 >/tmp/3dlite.log 2>&1 &
      - name: Run themed light icon smoke
        run: |
          cat > /tmp/smoke.js <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000',{waitUntil:'load',timeout:120000});
            await page.waitForTimeout(2500);
            const r=await page.evaluate(()=>{
              const out={};
              out.version=window.ThreeDLiteVersion;
              out.marker=!!window.__3DLiteLightViewportIcons3982;
              out.api=window.ThreeDLiteLightViewportIcons3982;
              const types=['point','spot','rectangle','disc','sphere','sun','dome','mesh'];
              out.items=[];
              for(const type of types){
                const o=EditorLightSystem.create(type,{size:25,color:'#ff0000'});
                const before=o.geometry.boundingSphere?.radius||0;
                const materialColor=o.material?.color?.getHexString?.();
                o.userData.renderLight.size=250;
                EditorLightSystem.updateIcon(o);
                const after=o.geometry.boundingSphere?.radius||0;
                out.items.push({type,isLight:EditorLightSystem.isLightObject(o),before,after,materialColor,theme:o.userData.lightViewportIcon?.theme,px:o.userData.lightViewportIcon?.pixels,line:o.isLineSegments===true});
              }
              const snap=RenderSceneBoundary.buildSnapshot();
              out.lightCount=snap.lights.length;
              out.renderObjectCount=snap.objects.length;
              out.rnd1104=window.ThreeDLiteRenderErrorCodes?.['RND-1104']?.title||window.ThreeDLiteL3NCompleteRenderDebugger?.codes?.['RND-1104']?.title||null;
              out.debugList=!!window.ThreeDLiteRenderDebugListUI;
              return out;
            });
            console.log(JSON.stringify(r));
            if(r.version!=='3.98.2') throw new Error('version '+r.version);
            if(!r.marker||r.api?.mode!=='minimal-ui-themed-viewport-icons') throw new Error('marker/api missing');
            if(r.items.length!==8||r.items.some(x=>!x.isLight||!x.line||x.theme!=='editor-neutral'||x.px!==22)) throw new Error('icon contract failed '+JSON.stringify(r.items));
            if(r.items.some(x=>Math.abs(x.before-x.after)>1e-6)) throw new Error('physical size changed symbolic icon geometry');
            if(r.items.some(x=>x.materialColor!=='aeb4bc')) throw new Error('icon not UI themed');
            if(r.lightCount<8) throw new Error('lights missing from snapshot');
            if(!r.debugList) throw new Error('debug list missing');
            if(errors.some(e=>/ReferenceError|TypeError|SyntaxError|3DLite Renderer.*validation/i.test(e))) throw new Error('browser errors '+errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/smoke.js