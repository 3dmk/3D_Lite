name: L3N v3.98.3 All Lights Browser Smoke
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-browser-smoke-v3983-trigger'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: l3n-dev}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/3dlite.log 2>&1 &
      - name: Validate normalized light defaults and renderer sampling
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'load',timeout:120000});
            await page.waitForTimeout(2200);
            const result=await page.evaluate(()=>{
              const types=['point','spot','rectangle','disc','sphere','sun','dome','mesh'];
              const created=[];
              for(const type of types){
                const o=EditorLightSystem.create(type);
                o.position.set(0,0,100); o.rotation.set(0,0,0); o.updateMatrixWorld(true);
                const snap=EditorLightSystem.serialize(o);
                created.push({type,intensity:snap.intensity,direction:snap.direction,rotation:o.rotation.toArray().slice(0,3)});
              }
              const mk=(type,extra={})=>new RenderSceneLight({id:type,name:type,type,enabled:true,color:'#ffffff',intensity:1,range:0,size:25,width:50,height:50,coneAngle:60,penumbra:.15,castShadows:false,position:[0,0,100],direction:[0,0,-1],...extra});
              const lum=c=>c.reduce((a,b)=>a+b,0)/3;
              const samples={};
              samples.point=lum(DirectLightSampler.sample(mk('point'),[0,0,0]).radiance);
              samples.spot=lum(DirectLightSampler.sample(mk('spot'),[0,0,0]).radiance);
              samples.rectangle=lum(AreaLightSampler.sample(mk('rectangle'),[0,0,0],.5,.5).radiance);
              samples.disc=lum(AreaLightSampler.sample(mk('disc'),[0,0,0],.5,.5).radiance);
              samples.mesh=lum(AreaLightSampler.sample(mk('mesh'),[0,0,0],.5,.5).radiance);
              const sph=mk('sphere'); let best=0;
              for(let u=.05;u<1;u+=.1) for(let v=.05;v<1;v+=.1) best=Math.max(best,lum(AreaLightSampler.sample(sph,[0,0,0],u,v).radiance));
              samples.sphere=best;
              samples.sun=lum(DirectLightSampler.sample(mk('sun'),[0,0,0]).radiance);
              samples.dome=lum(EnvironmentSampler.radiance(mk('dome'),[0,0,1]));
              const scene={lights:types.map(type=>({id:type,name:type,type,enabled:true,color:'#ffffff',intensity:1,range:0,size:25,width:50,height:50,coneAngle:60,penumbra:.15,castShadows:false,position:[0,0,100],direction:[0,0,-1]}))};
              const compiled=SceneLightCompiler.compile(scene);
              return {version:window.ThreeDLiteVersion?.version||window.ThreeDLiteVersion,energy:window.ThreeDLiteLightEnergy3983,energyMarker:!!window.__3DLiteLightEnergy3983,directionMarker:!!window.__3DLiteLightDefaultDirection3983,created,samples,compiled:compiled.map(l=>({type:l.type,intensity:l.intensity}))};
            });
            console.log(JSON.stringify(result));
            if(result.version!=='3.98.3') throw new Error('version '+result.version);
            if(!result.energyMarker||!result.directionMarker) throw new Error('v3.98.3 light markers missing');
            if(result.created.length!==8||result.created.some(x=>x.intensity!==1)) throw new Error('not all created light defaults are intensity 1 '+JSON.stringify(result.created));
            if(result.compiled.some(x=>x.intensity!==1)) throw new Error('compiled intensity changed '+JSON.stringify(result.compiled));
            for(const [type,v] of Object.entries(result.samples)){
              if(!(Number.isFinite(v)&&v>0.2&&v<=1.05)) throw new Error(type+' intensity=1 outside normalized range: '+v);
            }
            const locals=['point','spot','rectangle','disc','sphere','mesh'].map(k=>result.samples[k]);
            const max=Math.max(...locals),min=Math.min(...locals);
            if(max/min>3) throw new Error('local light intensity spread too large '+JSON.stringify(result.samples));
            if(errors.some(e=>/ReferenceError|TypeError|SyntaxError|3DLite Renderer.*validation/i.test(e))) throw new Error('browser errors '+errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
