name: L3N v3.97.3 Debug Registry Update
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-debug-registry-v3973-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/l3n_debug_registry_v3973.py
      - name: Static sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>3DLite v3.97.3 L3N Diagnostic Learning</title>' in s
          assert '__3DLiteL3NDebugRegistry3973' in s
          assert 'ThreeDLiteL3NDebugRegistry' in s
          assert s.count('id="__3DLiteL3NDebugRegistry3973"') == 1
          assert s.lower().count('<script') == s.lower().count('</script>')
          print('static sanity passed')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes'
          else
            git commit -m 'L3N v3.97.3: add categorized debug learning registry'
            git push origin HEAD:l3n-dev
          fi
