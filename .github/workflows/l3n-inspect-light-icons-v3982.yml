name: L3N v3.98.2 Light Icon Inspect
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-inspect-light-icons-v3982-trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect light icon code
        run: python tools/inspect_light_icons_v3982.py
      - name: Commit inspection output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/v3982_light_icon_context.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Inspect v3.98.2 light viewport icon context'
          git push