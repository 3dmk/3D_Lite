name: L3N Inspect Spot v3.98.3
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-inspect-spot-v3983-trigger'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect spot lighting code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          pats=['spot','Spot','cone','innerCone','outerCone','renderLight','light.type','lightType']
          lines=s.splitlines()
          hits=[]
          for i,line in enumerate(lines):
            if any(p in line for p in pats):
              hits.append(i)
          seen=set()
          for i in hits:
            a=max(0,i-5); b=min(len(lines),i+8)
            key=(a,b)
            if key in seen: continue
            seen.add(key)
            print(f'--- lines {a+1}-{b} ---')
            for j in range(a,b): print(f'{j+1}: {lines[j]}')
          PY
