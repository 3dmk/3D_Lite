name: L3N Integration Steps 2-7
on:
  push:
    branches:
      - l3n-dev
    paths:
      - .l3n-integration-trigger
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - run: python3 tools/l3n_integrate_v396.py
      - run: python3 tools/l3n_deep_v397.py
      - run: |
          node -e "const fs=require('fs'),h=fs.readFileSync('index.html','utf8');if(!h.includes('__3DLiteL3NDeepIntegration397'))process.exit(1);const r=/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi;let m;while((m=r.exec(h))){if(!/\\bsrc\\s*=/.test(m[1]||''))new Function(m[2]||'')}"
      - run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "L3N deep integration: complete targets 1-15"
          git push origin HEAD:l3n-dev
