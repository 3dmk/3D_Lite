name: L3N v3.98.0 Kernel Inspect
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-kernel-inspect-v3980-trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact renderer blocks
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('tmp').mkdir(exist_ok=True)
          def block(marker,tail=';'):
              st=s.find(marker)
              if st<0:return 'MISSING '+marker
              b=s.find('{',st)
              if b<0:return 'NO BRACE '+marker
              depth=0; quote=None; esc=False; i=b
              while i<len(s):
                  c=s[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              e=i+1
                              while e<len(s) and s[e].isspace(): e+=1
                              if tail and s.startswith(tail,e): e+=len(tail)
                              return s[st:e]
                  i+=1
              return 'UNTERMINATED '+marker
          specs={
            'PathBSDFSampler':'const PathBSDFSampler=Object.freeze(',
            'RenderMIS':'const RenderMIS=Object.freeze(',
            'DielectricTransport':'const DielectricTransport=Object.freeze('
          }
          for name,marker in specs.items():
              Path(f'tmp/v3980_{name}.txt').write_text(block(marker),encoding='utf-8')
      - name: Commit exact blocks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/v3980_*.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Temporary v3.98.0 path sampler inspection'
          git push
