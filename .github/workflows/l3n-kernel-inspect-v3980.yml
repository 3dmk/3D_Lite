name: L3N v3.98.0 Kernel Inspect
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-kernel-inspect-v3980-trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract path sampler neighborhood
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('tmp').mkdir(exist_ok=True)
          terms=['PathBSDFSampler','RenderMIS','DielectricTransport']
          for term in terms:
              chunks=[]; start=0
              while True:
                  i=s.find(term,start)
                  if i<0:break
                  chunks.append(f'===== {term} @ {i} =====\n'+s[max(0,i-4500):min(len(s),i+12500)])
                  start=i+len(term)
                  if len(chunks)>=5:break
              Path(f'tmp/v3980_{term}.txt').write_text('\n\n'.join(chunks) if chunks else 'MISSING '+term,encoding='utf-8')
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/v3980_PathBSDFSampler.txt tmp/v3980_RenderMIS.txt tmp/v3980_DielectricTransport.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Temporary v3.98.0 broaden path sampler inspection'
          git push
