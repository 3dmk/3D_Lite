name: L3N v3.98.0 Kernel Consolidation
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-kernel-v3980-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final GGX VNDF/PDF consistency pass
        run: python tools/l3n_kernel_v3980_pdf_fix.py
      - name: Verify v3.98.0 kernel
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '3.98.0' in s
          assert 'SAH-12bin-normalized-leafcost-nearfirst' in s
          assert 'sampleVisibleHalfVector' in s
          assert 'visible-normal-sampling+matched-vndf-pdf' in s
          assert 'const specPdf=(D*G1)/(4*nDotV+1e-8);' in s
          assert '__3DLiteKernel3980' in s
          print('v3.98.0 final kernel checks passed')
          PY
      - name: Commit patched index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '3DLite v3.98.0 match GGX VNDF sampling and PDF'
          git push
