name: L3N v3.98.0 Kernel Consolidation
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-kernel-v3980-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.98.0 kernel passes
        run: python tools/l3n_kernel_v3980.py
      - name: Static syntax extraction check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '3.98.0' in s
          assert 'SAH-12bin-normalized-leafcost-nearfirst' in s
          assert 'sampleVisibleHalfVector' in s
          assert '__3DLiteKernel3980' in s
          print('v3.98.0 static patch checks passed')
          PY
      - name: Commit patched index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '3DLite v3.98.0 consolidate GI kernel in place'
          git push
