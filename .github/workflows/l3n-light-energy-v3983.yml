name: L3N v3.98.3 Normalize Light Energy
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-light-energy-v3983-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - name: Patch all light energy semantics
        run: python3 tools/l3n_light_energy_v3983.py
      - name: Static validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='ignore')
          assert '<title>3DLite v3.98.3 Light Energy Normalization</title>' in s
          assert 'window.__3DLiteLightEnergy3983=true' in s
          assert s.count('intensity:1') >= 8
          assert 'let attenuation=LightEnergyPolicy.distanceAttenuation(light,dist);' in s
          assert 'radiance:LightEnergyPolicy.radiance(light,attenuation*emitterCos)' in s
          assert 'light.intensity*attenuation*emitterCos/safeArea' not in s
          print('static light energy validation passed')
          PY
      - name: Commit patched index
        run: |
          git config user.name '3dmk'
          git config user.email 'noneatall2026@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'L3N v3.98.3: normalize all light intensity semantics'
          git push origin HEAD:l3n-dev
