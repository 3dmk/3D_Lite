name: L3N v3.98.1 Light Gizmo Inspect
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-light-gizmo-inspect-v3981-trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract light creation and helper code
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['PointLight','SpotLight','DirectionalLight','RectAreaLight','HemisphereLight','lightType','addLight','createLight','castShadow','intensity','Light']
          lines=s.splitlines()
          out=[]
          for i,line in enumerate(lines,1):
              if any(t.lower() in line.lower() for t in terms):
                  a=max(0,i-4); b=min(len(lines),i+5)
                  out.append(f'===== around line {i} =====\n'+'\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b)))
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/v3981_light_context.txt').write_text('\n\n'.join(out[:220]),encoding='utf-8')
      - name: Commit inspection file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/v3981_light_context.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Temporary v3.98.1 light gizmo inspection'
          git push
