name: L3N v3.98.1 Minimal Light Gizmos
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-light-gizmo-v3981-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal custom light gizmos
        run: python tools/l3n_light_gizmo_v3981.py
      - name: Verify static light gizmo structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '3.98.1' in s
          assert '__3DLiteLightGizmo3981' in s
          assert 'new THREE.LineSegments(geometry,material)' in s
          assert "case 'point':" in s and "case 'spot':" in s and "case 'rectangle':" in s
          assert "case 'disc':" in s and "case 'sphere':" in s and "case 'sun':" in s and "case 'dome':" in s and "case 'mesh':" in s
          print('v3.98.1 light gizmo static checks passed')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m '3DLite v3.98.1 minimal custom light gizmos'
          git push
