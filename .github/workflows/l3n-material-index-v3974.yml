name: L3N v3.97.4 Material Index Guard
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-material-index-v3974-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply material index guard
        run: python tools/l3n_material_index_guard_v3974.py
      - name: Static sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '3DLite v3.97.4' in s
          assert '__3DLiteMaterialIndexGuard3974' in s
          assert 'ThreeDLiteMaterialIndexGuard' in s
          assert 'material-index-out-of-range' in s
          assert 'this.mesh(obj,ids.length)' in s
          assert 'gr.materialIndex=safe' in s
          assert s.count('id="__3DLiteMaterialIndexGuard3974"') == 1
          print('static sanity passed')
          PY
      - name: Commit updated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes'
          else
            git commit -m 'L3N v3.97.4: repair material index out of range'
            git push origin HEAD:l3n-dev
          fi
