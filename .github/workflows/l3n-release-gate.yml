name: L3N Release Gate

on:
  push:
    branches: [l3n-dev]
  pull_request:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate 3DLite startup structure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const failures = [];

          // 1) Basic document markers.
          if (!/<!doctype html>/i.test(html)) failures.push('Missing <!doctype html>');
          if (!/<html\b/i.test(html) || !/<\/html>/i.test(html)) failures.push('Malformed html root');
          if (!/<body\b/i.test(html) || !/<\/body>/i.test(html)) failures.push('Malformed body');

          // 2) Parse complete script blocks and validate external-script integrity.
          const scriptRe = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m;
          let scriptCount = 0;
          const scriptRanges = [];
          while ((m = scriptRe.exec(html))) {
            scriptCount++;
            scriptRanges.push([m.index, scriptRe.lastIndex]);
            const attrs = m[1] || '';
            const body = (m[2] || '').trim();
            if (/\bsrc\s*=/.test(attrs) && body.length) {
              failures.push(`External script tag #${scriptCount} contains inline body code`);
            }
          }

          // Mask valid script blocks before looking for stray tags. This avoids counting
          // literal '<script' text that appears inside JavaScript strings/templates.
          let outsideScripts = html;
          for (let i = scriptRanges.length - 1; i >= 0; i--) {
            const [start, end] = scriptRanges[i];
            outsideScripts = outsideScripts.slice(0, start) + ' '.repeat(end - start) + outsideScripts.slice(end);
          }
          const strayOpenScripts = (outsideScripts.match(/<script\b/gi)||[]).length;
          const strayCloseScripts = (outsideScripts.match(/<\/script\s*>/gi)||[]).length;
          if (strayOpenScripts || strayCloseScripts) {
            failures.push(`Stray/unmatched script tags outside parsed blocks: ${strayOpenScripts} open / ${strayCloseScripts} close`);
          }

          // 3) Duplicate DOM ids are release-blocking.
          const ids = [...html.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(x=>x[1]);
          const seen = new Set();
          const dup = new Set();
          for (const id of ids) { if (seen.has(id)) dup.add(id); else seen.add(id); }
          if (dup.size) failures.push('Duplicate IDs: ' + [...dup].join(', '));

          // 4) Detect direct animation loop starts. 3DLite should own only one continuous loop.
          const loopStarts = [...html.matchAll(/requestAnimationFrame\s*\(\s*animate\s*\)/g)].length;
          if (loopStarts > 1) failures.push(`Multiple animation-loop starts detected: ${loopStarts}`);

          // 5) Require runtime error capture / boot observability markers.
          const hasErrorCapture = /unhandledrejection/.test(html) && /window-error/.test(html);
          if (!hasErrorCapture) failures.push('Runtime error telemetry markers missing');

          const hasRuntimeLearning = /L3N Runtime Learning/.test(html);
          if (!hasRuntimeLearning) failures.push('L3N Runtime Learning block missing');

          // 6) Three.js must be referenced somewhere because the viewport depends on it.
          if (!/three(\.min)?\.js|THREE\./i.test(html)) failures.push('Three.js dependency/reference not found');

          console.log(`Checked ${ids.length} ids and ${scriptCount} parsed script blocks.`);
          if (failures.length) {
            console.error('\nL3N RELEASE GATE FAILED');
            for (const f of failures) console.error(' - ' + f);
            process.exit(1);
          }
          console.log('L3N RELEASE GATE PASSED');
          NODE

      - name: Record gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 3DLite L3N Release Gate'
            echo ''
            echo '- Branch: `${{ github.ref_name }}`'
            echo '- Commit: `${{ github.sha }}`'
            echo '- Gate checks startup structure, duplicate IDs, script integrity, loop ownership, runtime telemetry, and Three.js dependency markers.'
          } >> "$GITHUB_STEP_SUMMARY"
