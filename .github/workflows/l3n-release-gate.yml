name: L3N Release Gate

on:
  push:
    branches: [l3n-dev]
  pull_request:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate LitePix/3DLite startup structure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const failures = [];
          const warnings = [];

          if (!/<!doctype html>/i.test(html)) failures.push('Missing <!doctype html>');
          if (!/<html\b/i.test(html) || !/<\/html>/i.test(html)) failures.push('Malformed html root');
          if (!/<body\b/i.test(html) || !/<\/body>/i.test(html)) failures.push('Malformed body');

          const scriptRe = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, scriptCount = 0;
          const scriptRanges = [];
          while ((m = scriptRe.exec(html))) {
            scriptCount++;
            scriptRanges.push([m.index, scriptRe.lastIndex]);
            const attrs = m[1] || '';
            const body = (m[2] || '').trim();
            if (/\bsrc\s*=/.test(attrs) && body.length) failures.push(`External script tag #${scriptCount} contains inline body code`);
          }
          let outsideScripts = html;
          for (let i = scriptRanges.length - 1; i >= 0; i--) {
            const [start, end] = scriptRanges[i];
            outsideScripts = outsideScripts.slice(0, start) + ' '.repeat(end - start) + outsideScripts.slice(end);
          }
          const strayOpenScripts = (outsideScripts.match(/<script\b/gi)||[]).length;
          const strayCloseScripts = (outsideScripts.match(/<\/script\s*>/gi)||[]).length;
          if (strayOpenScripts || strayCloseScripts) failures.push(`Stray/unmatched script tags outside parsed blocks: ${strayOpenScripts} open / ${strayCloseScripts} close`);

          const ids = [...html.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(x=>x[1]);
          const seenIds = new Set(), duplicateIds = new Set();
          for (const id of ids) { if (seenIds.has(id)) duplicateIds.add(id); else seenIds.add(id); }
          if (duplicateIds.size) failures.push('Duplicate IDs: ' + [...duplicateIds].join(', '));

          const loopStarts = [...html.matchAll(/requestAnimationFrame\s*\(\s*animate\s*\)/g)].length;
          if (loopStarts !== 1) failures.push(`Expected exactly one animation-loop owner; found ${loopStarts}`);

          const hasErrorCapture = /unhandledrejection/.test(html) && /window-error/.test(html);
          if (!hasErrorCapture) failures.push('Runtime error telemetry markers missing');
          if (!/L3N Runtime Learning/.test(html)) failures.push('L3N Runtime Learning block missing');
          if (!/three(\.min)?\.js|THREE\./i.test(html)) failures.push('Three.js dependency/reference not found');

          if (!/if\s*\(\s*ts===lastFrame\s*\)\s*return false/.test(html)) failures.push('RAF telemetry timestamp deduplication missing');
          if (!/if\s*\(\s*dt>0\s*\)/.test(html)) failures.push('Positive frame-time guard missing');

          const serviceNames = [...html.matchAll(/\bconst\s+((?:ThreeDLite|LitePix)[A-Za-z0-9_$]+)\s*=/g)].map(x=>x[1]);
          const seenServices = new Set(), duplicateServices = new Set();
          for (const name of serviceNames) { if (seenServices.has(name)) duplicateServices.add(name); else seenServices.add(name); }
          if (duplicateServices.size) failures.push('Duplicate project service declarations: ' + [...duplicateServices].join(', '));

          const titleMatch = html.match(/<title>(?:LitePix|3DLite)\s+v(\d+\.\d+\.\d+)[^<]*<\/title>/i);
          if (!titleMatch) failures.push('LitePix/3DLite semantic version missing from document title');
          const litePix = /const LitePixVersion=Object\.freeze\(\{name:'LitePix',version:'4\.00\.0'/.test(html);
          if (/<title>LitePix\b/i.test(html) && !litePix) failures.push('LitePix title present without central LitePixVersion owner');
          if (/3DLite v3\.93\.0 — L3N Runtime Learning/.test(html)) warnings.push('Stale v3.93.0 Runtime Learning section comment remains; non-blocking documentation debt.');

          console.log(`Checked ${ids.length} ids, ${scriptCount} parsed script blocks, and ${serviceNames.length} project service declarations.`);
          for (const w of warnings) console.warn('WARNING: ' + w);
          if (failures.length) {
            console.error('\nL3N RELEASE GATE FAILED');
            for (const f of failures) console.error(' - ' + f);
            process.exit(1);
          }
          console.log('L3N RELEASE GATE PASSED');
          NODE

      - name: Record gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## LitePix / 3DLite L3N Release Gate'
            echo ''
            echo '- Branch: `${{ github.ref_name }}`'
            echo '- Commit: `${{ github.sha }}`'
            echo '- Gate checks startup structure, duplicate IDs, script integrity, single-loop ownership, runtime telemetry correctness, service duplication, version identity, and Three.js dependency markers.'
          } >> "$GITHUB_STEP_SUMMARY"
