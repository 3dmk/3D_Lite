name: L3N v3.97.7 Render Debug List
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-render-debug-list-v3977-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply selectable render-debug list
        run: python tools/l3n_render_debug_list_v3977.py
      - name: Static sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['3DLite v3.97.7','__3DLiteRenderDebugList3977','ThreeDLiteRenderDebugListUI','l3nRenderDebugListWindow','l3nRenderDebugListText','Copy Selected','Copy All']
          for x in required: assert x in s,x
          assert s.count('id="__3DLiteRenderDebugList3977"')==1
          print('static sanity passed')
          PY
      - name: Commit updated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes'
          else
            git commit -m 'L3N v3.97.7: add selectable render debugging list'
            git push origin HEAD:l3n-dev
          fi
