name: L3N v3.97.6 Runtime + Render Debugger
on:
  push:
    branches: [l3n-dev]
    paths:
      - '.l3n-runtime-render-debug-v3976-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v3.97.6 runtime/render diagnostics
        run: python tools/l3n_runtime_render_debug_v3976.py
      - name: Static sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['3DLite v3.97.6','__3DLiteL3NRuntimeRenderDebug3976','ThreeDLiteL3NCompleteRenderDebugger','ThreeDLiteL3NRuntimeReportSync','RND-1194','renderDebugSummary','versionSynchronized']
          for x in required: assert x in s,x
          assert '3.93.0' not in s
          assert s.count('id="__3DLiteL3NRuntimeRenderDebug3976"')==1
          print('static sanity passed')
          PY
      - name: Commit updated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes'
          else
            git commit -m 'L3N v3.97.6: synchronize Runtime Learning and complete render diagnostics'
            git push origin HEAD:l3n-dev
          fi
