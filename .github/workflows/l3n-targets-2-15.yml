name: L3N Targets 2-15 Implementation

on:
  push:
    branches: [l3n-dev]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - name: Apply target patch
        run: python3 tools/l3n_targets_patch.py
      - name: Verify markers
        run: |
          grep -q '__3DLiteL3N15TargetLayer' index.html
          grep -q '3DLite v3.95.0 L3N 15-Target Development' index.html
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'L3N targets 2-15: add consolidated reliability infrastructure'
          git push origin HEAD:l3n-dev
