name: L3N Version Bump v3.97.2
on:
  push:
    branches: [l3n-dev]
    paths: ['.l3n-version-bump-v3972-trigger']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - run: python3 tools/l3n_version_bump_v3972.py
      - run: |
          node -e "const fs=require('fs'),h=fs.readFileSync('index.html','utf8');if(!h.includes(\"const ThreeDLiteVersion=Object.freeze({name:'3DLite',version:'3.97.2'});\"))process.exit(1);const r=/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi;let m;while((m=r.exec(h))){if(!/\\bsrc\\s*=/.test(m[1]||''))new Function(m[2]||'')}"
      - run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "3DLite v3.97.2: increment software version"
          git push origin HEAD:l3n-dev
