name: L3N v3.97 Version Sync
on:
  push:
    branches: [l3n-dev]
    paths: ['.l3n-version-sync-trigger']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l3n-dev
      - run: python3 tools/l3n_version_sync_v397.py
      - run: |
          node -e "const fs=require('fs'),h=fs.readFileSync('index.html','utf8');if(!h.includes(\"const ThreeDLiteVersion=Object.freeze({name:'3DLite',version:'3.97.0'});\"))process.exit(1)"
      - run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "L3N v3.97: synchronize public version identity"
          git push origin HEAD:l3n-dev
