name: LitePix v4.10 Path Extract
on:
  push:
    branches: [litepix-v4.10-path-integration]
    paths: ['.github/workflows/litepix-v410-path-extract.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: litepix-v4.10-path-integration
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          out=[]
          for a,b,name in [(7670,7900,'path-core'),(8300,8630,'progressive'),(10440,10510,'master')]:
            out.append('\n===== '+name+' =====\n')
            out.extend(f'{i+1}: {s[i]}' for i in range(a-1,min(b,len(s))))
          Path('reports/litepix/v4.10-path-sections.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name 'LitePix Path Extract'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/litepix/v4.10-path-sections.txt
          git commit -m 'Extract v4.10 path renderer sections' || exit 0
          git push origin HEAD:litepix-v4.10-path-integration
