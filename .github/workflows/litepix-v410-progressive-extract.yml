name: LitePix v4.10 Progressive Extract
on:
  push:
    branches: [litepix-v4.10-path-integration]
    paths: ['.github/workflows/litepix-v410-progressive-extract.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: litepix-v4.10-path-integration
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          a,b=8450,8635
          Path('reports/litepix/v4.10-progressive-loop.txt').write_text('\n'.join(f'{i+1}: {s[i]}' for i in range(a-1,min(b,len(s)))),encoding='utf-8')
          PY
      - run: |
          git config user.name 'LitePix Path Extract'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/litepix/v4.10-progressive-loop.txt
          git commit -m 'Extract v4.10 progressive path loop' || exit 0
          git push origin HEAD:litepix-v4.10-path-integration
