name: LitePix v4.11 Core2 Path Gate
on:
  push:
    branches: [litepix-v4.11-core2-bvh-path]
    paths:
      - 'litepix/core2-path-v4.11.js'
      - 'patches/litepix/v4.11/**'
      - '.github/workflows/litepix-v411-core2-path-gate.yml'
permissions:
  contents: write
jobs:
  core2-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: litepix-v4.11-core2-bvh-path
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Core2 adapter syntax gate
        run: node --check litepix/core2-path-v4.11.js
      - name: Apply v4.11 Core2 Path integration
        run: python3 patches/litepix/v4.11/apply-core2-path.py
      - name: Structural release gate
        run: |
          node <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('index.html','utf8'),f=[];
          if(!h.includes('<title>LitePix v4.11.0 Core2 Path BVH</title>'))f.push('v4.11 title missing');
          if(!/const\s+LitePixVersion\s*=\s*Object\.freeze\(\{[^;]*name:'LitePix'[^;]*version:'4\.11\.0'[^;]*\}\);/.test(h))f.push('v4.11 central version missing');
          for(const x of ['core2-path-v4.11.js','window.LitePixCore2PathAcceleration411.wrap(acceleration,job)','litePixCore2BVH:job.litePixCore2Acceleration411?.snapshot?.()||null'])if(!h.includes(x))f.push('missing '+x);
          const ids=[...h.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]),seen=new Set(),dups=[];for(const id of ids){if(seen.has(id))dups.push(id);else seen.add(id)}if(dups.length)f.push('duplicate ids '+[...new Set(dups)].join(','));
          const ext=[...h.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>/\bsrc\s*=/.test(m[1])&&(m[2]||'').trim());if(ext.length)f.push('external script inline bodies '+ext.length);
          const loops=(h.match(/requestAnimationFrame\s*\(\s*animate\s*\)/g)||[]).length;if(loops!==1)f.push('animation loop owners '+loops);
          if(f.length){console.error(f.join('\n'));process.exit(1)}
          console.log('LitePix v4.11 structural gate passed');
          NODE
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser correctness and traversal benchmark
        run: |
          set -o pipefail
          python3 -m http.server 8000 >/tmp/lp411-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/lp411.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(4000);
            const core=await page.evaluate(()=>({title:document.title,version:window.LitePixVersion?.version||null,marker:window.__LitePixCore2Path411===true,adapterType:typeof window.LitePixCore2PathAcceleration411}));
            const set=engine=>page.evaluate(engine=>{const sv=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};sv('rsEngine',engine);sv('rsWidth',160);sv('rsHeight',90);sv('rsBounces',4);sv('rsMinSamples',1);sv('rsMaxSamples',3);sv('rsNoise',.05);sv('rsExposure',0);},engine);
            const render=async(engine,useCore2)=>{await set(engine);await page.evaluate(v=>window.__LitePixCore2Path411Enabled=v,useCore2);const prior=await page.evaluate(()=>window.RenderFramework?.jobs?.lastJob?.id||0);const t=Date.now();await page.evaluate(()=>document.getElementById('renderNowBtn').click());await page.waitForFunction(prior=>{const j=window.RenderFramework?.jobs?.lastJob;return !!j&&j.id!==prior&&j.finished&&j.performance;},prior,{timeout:120000,polling:100});return page.evaluate(wall=>{const j=window.RenderFramework.jobs.lastJob,rgba=j.beautyFrame?.rgba||j.beautyFrame?.data||null;return{wallMs:Date.now()-wall,engine:j.settings.engine,renderer:j.beautyFrame?.metadata?.renderer||null,performance:j.performance,secondaryGI:j.beautyFrame?.metadata?.secondaryGI||null,core2:j.beautyFrame?.metadata?.litePixCore2BVH||j.litePixCore2Acceleration411?.snapshot?.()||null,rgba:rgba?Array.from(rgba):null};},t)};
            const fast=await render('fast',true);
            const legacy=await render('path',false);
            const core2=await render('path',true);
            let maxDiff=Infinity,meanDiff=Infinity;if(legacy.rgba&&core2.rgba&&legacy.rgba.length===core2.rgba.length){let mx=0,sum=0;for(let i=0;i<legacy.rgba.length;i++){const d=Math.abs(legacy.rgba[i]-core2.rgba[i]);if(d>mx)mx=d;sum+=d;}maxDiff=mx;meanDiff=sum/legacy.rgba.length;}
            delete legacy.rgba;delete core2.rgba;delete fast.rgba;
            const speedup=(legacy.performance?.traceMs>0&&core2.performance?.traceMs>0)?legacy.performance.traceMs/core2.performance.traceMs:null;
            const f=[];
            if(response?.status()!==200)f.push('HTTP != 200');
            if(core.version!=='4.11.0'||!core.marker||core.adapterType!=='function')f.push('v4.11 identity/adapter mismatch');
            if(fast.engine!=='fast'||fast.renderer!=='Part 4 Fast Direct')f.push('Fast regression failed');
            if(legacy.engine!=='path'||core2.engine!=='path')f.push('Path regression failed');
            if(!core2.core2||core2.core2.version!=='4.11.0'||!(core2.core2.traceRays>0)||!(core2.core2.nodeTests>0)||!(core2.core2.triangleTests>0))f.push('Core2 BVH did not own real path traversal');
            if(core2.secondaryGI!=='Light Cache')f.push('Light Cache not active');
            if(!(maxDiff<=1&&meanDiff<=0.02))f.push('Core2 image mismatch max='+maxDiff+' mean='+meanDiff);
            if(pageErrors.length)f.push('page errors '+pageErrors.length);
            if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            const out={passed:!f.length,core,fast,legacy,core2,comparison:{maxPixelDiff:maxDiff,meanPixelDiff:meanDiff,traceSpeedup:speedup,legacyTraceMs:legacy.performance?.traceMs||null,core2TraceMs:core2.performance?.traceMs||null,legacyWallMs:legacy.wallMs,core2WallMs:core2.wallMs},pageErrors,consoleErrors,failures:f};console.log(JSON.stringify(out,null,2));
            await browser.close();if(f.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save v4.11 report
        run: |
          mkdir -p reports/litepix
          cp /tmp/lp411.json reports/litepix/v4.11-core2-path-report.json
      - name: Commit gated v4.11 build
        run: |
          git config user.name 'LitePix v4.11 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html reports/litepix/v4.11-core2-path-report.json
          git commit -m 'Gate LitePix v4.11 Core2 Path BVH' || exit 0
          git push origin HEAD:litepix-v4.11-core2-bvh-path
