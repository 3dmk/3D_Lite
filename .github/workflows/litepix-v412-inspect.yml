name: LitePix v4.12 Shadow Inspect
on:
  push:
    branches: [litepix-v4.12-large-scene-bvh-shadow]
    paths: ['.github/workflows/litepix-v412-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: litepix-v4.12-large-scene-bvh-shadow
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          terms=['occluded(','anyHit(','shadowRay','shadow ray','visibility','isVisible','tracePixel(job','trace(job,acceleration','acceleration.trace(','LightSampling','DirectLighting','sampleLight','tMax:distance']
          out=[]; seen=set()
          for term in terms:
            hits=[i for i,line in enumerate(s) if term.lower() in line.lower()]
            for i in hits[:8]:
              lo=max(0,i-35); hi=min(len(s),i+80)
              key=(lo,hi)
              if key in seen: continue
              out.append('\n===== '+term+f' @ {i+1} =====')
              out.extend(f'{j+1}: {s[j]}' for j in range(lo,hi))
              seen.add(key)
          Path('reports/litepix').mkdir(parents=True,exist_ok=True)
          Path('reports/litepix/v4.12-shadow-inspect.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name 'LitePix v4.12 Inspect'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/litepix/v4.12-shadow-inspect.txt
          git commit -m 'Inspect LitePix v4.12 shadow traversal flow' || exit 0
          git push origin HEAD:litepix-v4.12-large-scene-bvh-shadow
