name: LitePix v4.13 Browser Gate
on:
  push:
    branches: [litepix-v4.13-blas-tlas-refit]
    paths:
      - 'index.html'
      - 'litepix/core2-instance-v4.13.js'
      - '.github/workflows/litepix-v413-browser-gate.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser Path parity and real scene BLAS TLAS
        run: |
          set -o pipefail
          python3 -m http.server 8000 >/tmp/lp413-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/lp413.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(async()=>{
              const shared=new THREE.BoxGeometry(55,55,55);
              const mat=new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.65,metalness:0});
              for(const [i,x] of [-42,42].entries()){
                const m=new THREE.Mesh(shared,mat);m.name='LP413Shared'+i;m.position.set(x,0,28);m.userData.primitiveType='box';scene.add(m);objects.push(m);
              }
              camera.position.set(155,-190,115);camera.up.set(0,0,1);camera.lookAt(0,0,25);camera.updateMatrixWorld(true);camera.updateProjectionMatrix();
              window.__3DLiteGeometryRevision=(window.__3DLiteGeometryRevision||0)+1;window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;RenderAccelerationCache16?.reset?.();
              const snap=RenderSceneBoundary.buildSnapshot();
              const repeated=snap.objects.filter(o=>o.geometryId===shared.uuid);
              const localReady=repeated.length===2&&repeated.every(o=>o.localMesh&&o.transform?.length===12);
              const sv=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              sv('rsEngine','path');sv('rsWidth',120);sv('rsHeight',68);sv('rsBounces',3);sv('rsMinSamples',1);sv('rsMaxSamples',2);sv('rsNoise',.05);sv('rsExposure',0);
              async function render(scene413){window.__LitePixCore2Scene413Enabled=scene413;window.__LitePixCore2Path412Enabled=true;const prior=RenderFramework?.jobs?.lastJob?.id||0,t=Date.now();document.getElementById('renderNowBtn').click();while(true){await new Promise(r=>setTimeout(r,50));const j=RenderFramework.jobs.lastJob;if(j&&j.id!==prior&&j.finished&&j.performance){const rgba=j.beautyFrame?.rgba||j.beautyFrame?.data||null;return{wallMs:Date.now()-t,performance:j.performance,secondaryGI:j.beautyFrame?.metadata?.secondaryGI||null,scene:j.beautyFrame?.metadata?.litePixCore2Scene||j.litePixCore2Scene413?.snapshot?.()||null,fallback:j.beautyFrame?.metadata?.litePixCore2BVH||null,rgba:rgba?Array.from(rgba):null};}}
              }
              const v412=await render(false),v413=await render(true);let maxPixelDiff=Infinity,meanPixelDiff=Infinity;if(v412.rgba&&v413.rgba&&v412.rgba.length===v413.rgba.length){let mx=0,sum=0;for(let i=0;i<v412.rgba.length;i++){const d=Math.abs(v412.rgba[i]-v413.rgba[i]);if(d>mx)mx=d;sum+=d;}maxPixelDiff=mx;meanPixelDiff=sum/v412.rgba.length;}delete v412.rgba;delete v413.rgba;
              return{identity:{title:document.title,version:window.LitePixVersion?.version,marker:window.__LitePixCore2Scene413===true},snapshot:{localReady,repeated:repeated.length},v412,v413,maxPixelDiff,meanPixelDiff};
            });
            const f=[];
            if(response?.status()!==200)f.push('HTTP != 200');
            if(result.identity.version!=='4.13.0'||!result.identity.marker)f.push('v4.13 identity mismatch');
            if(!result.snapshot.localReady)f.push('local mesh/transform snapshot missing');
            if(!result.v413.scene||result.v413.scene.fallback)f.push('real v4.13 scene acceleration not active');
            if(!(result.v413.scene.instances>=2&&result.v413.scene.uniqueBLAS<result.v413.scene.instances))f.push('BLAS sharing not observed');
            if(result.v413.secondaryGI!=='Light Cache')f.push('Light Cache inactive');
            if(!(result.maxPixelDiff<=1&&result.meanPixelDiff<=0.02))f.push('Path parity failed '+result.maxPixelDiff+'/'+result.meanPixelDiff);
            if(pageErrors.length)f.push('page errors '+pageErrors.length);if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            const out={passed:!f.length,...result,pageErrors,consoleErrors,failures:f};console.log(JSON.stringify(out,null,2));await browser.close();if(f.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save report
        if: always()
        run: |
          mkdir -p reports/litepix
          test -f /tmp/lp413.json && cp /tmp/lp413.json reports/litepix/v4.13-browser-report.json || true
