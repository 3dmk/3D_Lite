name: LitePix v4.13 Scene Inspect
on:
  push:
    branches: [litepix-v4.13-blas-tlas-refit]
    paths: ['.github/workflows/litepix-v413-scene-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          terms=['RenderGeometryCompiler','compileScene(renderScene','compileObject','renderScene.objects','matrixWorld','worldMatrix','transform','RenderSceneBoundary','mesh:{','positions:']
          out=[];seen=set()
          for term in terms:
            for i,line in enumerate(s):
              if term.lower() in line.lower():
                lo=max(0,i-45);hi=min(len(s),i+120);key=(lo,hi)
                if key in seen: continue
                out.append(f'\n===== {term} @ {i+1} =====')
                out.extend(f'{j+1}: {s[j]}' for j in range(lo,hi));seen.add(key)
                if len(out)>3500: break
          Path('reports/litepix').mkdir(parents=True,exist_ok=True)
          Path('reports/litepix/v4.13-scene-inspect.txt').write_text('\n'.join(out))
          PY
      - run: |
          git config user.name 'LitePix v4.13 Inspect'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/litepix/v4.13-scene-inspect.txt
          git commit -m 'Inspect v4.13 scene structure for TLAS integration' || exit 0
          git push