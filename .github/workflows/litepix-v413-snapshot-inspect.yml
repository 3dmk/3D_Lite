name: LitePix v4.13 Snapshot Inspect
on:
  push:
    branches: [litepix-v4.13-blas-tlas-refit]
    paths: ['.github/workflows/litepix-v413-snapshot-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          out='\n'.join(f'{i+1}: {s[i]}' for i in range(4480,4745))
          Path('reports/litepix').mkdir(parents=True,exist_ok=True)
          Path('reports/litepix/v4.13-snapshot-inspect.txt').write_text(out)
          PY
      - run: |
          git config user.name 'LitePix v4.13 Snapshot Inspect'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/litepix/v4.13-snapshot-inspect.txt
          git commit -m 'Inspect v4.13 render snapshot transform data' || exit 0
          git push