name: LitePix v4.14 Persistent Core2 Cache Gate
on:
  push:
    branches: [litepix-v4.14-core2-persistent-cache]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply v4.14 integration
        run: python3 patches/litepix/v4.14/apply-persistent-cache.py
      - name: Structural and syntax gate
        run: |
          set -euo pipefail
          node --check litepix/core2-cache-v4.14.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['LitePix v4.14.0 Persistent Core2 Cache',"version:'4.14.0'",'core2-cache-v4.14.js','LitePixCore2PersistentAcceleration414.wrap(acceleration,job)','litePixCore2Persistent:job.litePixCore2Persistent414?.snapshot?.()||null','root.__3DLiteMaterialLinearColor3996=true;']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          if s.count('LitePixCore2PersistentAcceleration414.wrap(acceleration,job)') < 2: raise SystemExit('Path primary+bounce v4.14 routing incomplete')
          js=Path('litepix/core2-cache-v4.14.js').read_text(encoding='utf-8')
          for x in ['LitePixPersistentSceneCache414','reuse-clean','mode=\'refit\'','meshHash','dirtyTransforms','LitePixCore2PersistentCache414']:
              if x not in js: raise SystemExit('missing '+x)
          ids=[]
          import re
          for m in re.finditer(r'\bid\s*=\s*["\']([^"\']+)["\']',s,re.I): ids.append(m.group(1))
          if len(ids)!=len(set(ids)): raise SystemExit('duplicate ids found')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',s,re.I)
          bad=[1 for attrs,body in scripts if re.search(r'\bsrc\s*=',attrs) and body.strip()]
          if bad: raise SystemExit('external script inline body found')
          loops=len(re.findall(r'requestAnimationFrame\s*\(\s*animate\s*\)',s))
          if loops!=1: raise SystemExit(f'animation loop owners {loops}')
          print('LitePix v4.14 structural gate passed')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser persistent cache and dirty-transform gate
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/lp414-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/lp414.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(async()=>{
              const shared=new THREE.BoxGeometry(55,55,55),mat=new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.65,metalness:0});
              const test=[];for(const [i,x] of [-42,42].entries()){const m=new THREE.Mesh(shared,mat);m.name='LP414Shared'+i;m.position.set(x,0,28);m.userData.primitiveType='box';scene.add(m);objects.push(m);test.push(m);}
              camera.position.set(155,-190,115);camera.up.set(0,0,1);camera.lookAt(0,0,25);camera.updateMatrixWorld(true);camera.updateProjectionMatrix();
              window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;window.__3DLiteGeometryRevision=(window.__3DLiteGeometryRevision||0)+1;RenderAccelerationCache16?.reset?.();LitePixCore2PersistentCache414.reset();
              const sv=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              sv('rsEngine','path');sv('rsWidth',120);sv('rsHeight',68);sv('rsBounces',3);sv('rsMinSamples',1);sv('rsMaxSamples',2);sv('rsNoise',.05);sv('rsExposure',0);
              async function render(use414){window.__LitePixCore2Persistent414Enabled=use414;window.__LitePixCore2Scene413Enabled=true;window.__LitePixCore2Path412Enabled=true;const prior=RenderFramework?.jobs?.lastJob?.id||0,t=Date.now();document.getElementById('renderNowBtn').click();while(true){await new Promise(r=>setTimeout(r,40));const j=RenderFramework.jobs.lastJob;if(j&&j.id!==prior&&j.finished&&j.performance){const rgba=j.beautyFrame?.rgba||j.beautyFrame?.data||null;return{wallMs:Date.now()-t,performance:j.performance,secondaryGI:j.beautyFrame?.metadata?.secondaryGI||null,persistent:j.beautyFrame?.metadata?.litePixCore2Persistent||null,scene:j.beautyFrame?.metadata?.litePixCore2Scene||null,rgba:rgba?Array.from(rgba):null};}}}
              const first=await render(true),second=await render(true);
              test[0].position.x+=17;test[0].updateMatrixWorld(true);window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;
              const refit=await render(true),rebuilt=await render(false);
              let maxPixelDiff=Infinity,meanPixelDiff=Infinity;if(refit.rgba&&rebuilt.rgba&&refit.rgba.length===rebuilt.rgba.length){let mx=0,sum=0;for(let i=0;i<refit.rgba.length;i++){const d=Math.abs(refit.rgba[i]-rebuilt.rgba[i]);if(d>mx)mx=d;sum+=d;}maxPixelDiff=mx;meanPixelDiff=sum/refit.rgba.length;}
              for(const x of [first,second,refit,rebuilt])delete x.rgba;
              return{identity:{title:document.title,version:window.LitePixVersion?.version,marker:window.__LitePixCore2Persistent414===true},first,second,refit,rebuilt,maxPixelDiff,meanPixelDiff,cache:LitePixCore2PersistentCache414.snapshot()};
            });
            const f=[];if(response?.status()!==200)f.push('HTTP != 200');if(result.identity.version!=='4.14.0'||!result.identity.marker)f.push('v4.14 identity mismatch');
            if(result.first.persistent?.cacheMode!=='rebuild')f.push('first render did not rebuild');
            if(result.second.persistent?.cacheMode!=='reuse-clean')f.push('second render did not clean-reuse');
            if(result.refit.persistent?.cacheMode!=='refit'||!(result.refit.persistent?.dirtyTransforms>=1))f.push('transform render did not refit');
            if(!(result.refit.persistent?.cache?.builds===1&&result.refit.persistent?.cache?.refits>=1&&result.refit.persistent?.cache?.cleanReuses>=1))f.push('persistent cache counters wrong');
            if(result.refit.secondaryGI!=='Light Cache'||result.rebuilt.secondaryGI!=='Light Cache')f.push('Light Cache inactive');
            if(!(result.maxPixelDiff<=1&&result.meanPixelDiff<=0.02))f.push('refit/rebuild Path parity failed '+result.maxPixelDiff+'/'+result.meanPixelDiff);
            if(pageErrors.length)f.push('page errors '+pageErrors.length);if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            const out={passed:!f.length,...result,pageErrors,consoleErrors,failures:f};console.log(JSON.stringify(out,null,2));await browser.close();if(f.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save report
        if: always()
        run: |
          mkdir -p reports/litepix
          test -f /tmp/lp414.json && cp /tmp/lp414.json reports/litepix/v4.14-persistent-cache-report.json || true
      - name: Commit gated build
        if: success()
        run: |
          git config user.name 'LitePix v4.14 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html reports/litepix/v4.14-persistent-cache-report.json
          git commit -m 'Gate LitePix v4.14 persistent Core2 cache' || exit 0
          git push origin HEAD:litepix-v4.14-core2-persistent-cache
