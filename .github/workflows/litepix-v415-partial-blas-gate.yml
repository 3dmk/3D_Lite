name: LitePix v4.15 Partial BLAS Gate
on:
  push:
    branches: [litepix-v4.15-partial-blas]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Apply v4.15 integration
        run: python3 patches/litepix/v4.15/apply-partial-blas.py
      - name: Structural and syntax gate
        run: |
          set -euo pipefail
          node --check litepix/core2-instance-v4.13.js
          node --check litepix/core2-cache-v4.15.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          req=['LitePix v4.15.0 Partial BLAS Invalidation',"version:'4.15.0'",'core2-cache-v4.15.js','LitePixCore2PartialAcceleration415.wrap(acceleration,job)','litePixCore2Partial:job.litePixCore2Partial415?.snapshot?.()||null','root.__3DLiteMaterialLinearColor3996=true;']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          if s.count('LitePixCore2PartialAcceleration415.wrap(acceleration,job)') < 2: raise SystemExit('Path primary+bounce v4.15 routing incomplete')
          js=Path('litepix/core2-instance-v4.13.js').read_text(encoding='utf-8')
          if 'root.LitePixLocalBLAS413=LitePixLocalBLAS413;' not in js: raise SystemExit('local BLAS export missing')
          ids=re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',s,re.I)
          if len(ids)!=len(set(ids)): raise SystemExit('duplicate ids found')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',s,re.I)
          if any(re.search(r'\bsrc\s*=',a) and b.strip() for a,b in scripts): raise SystemExit('external script inline body found')
          if len(re.findall(r'requestAnimationFrame\s*\(\s*animate\s*\)',s))!=1: raise SystemExit('animation loop owner mismatch')
          print('LitePix v4.15 structural gate passed')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser partial BLAS invalidation gate
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/lp415-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/lp415.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});await page.waitForTimeout(2500);
            const result=await page.evaluate(async()=>{
              const mat=new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.65,metalness:0});
              const g0=new THREE.BoxGeometry(55,55,55),g1=new THREE.SphereGeometry(31,12,8);
              const a=new THREE.Mesh(g0,mat),b=new THREE.Mesh(g1,mat);a.name='LP415Box';b.name='LP415Sphere';a.position.set(-42,0,28);b.position.set(42,0,31);scene.add(a,b);objects.push(a,b);
              camera.position.set(155,-190,115);camera.up.set(0,0,1);camera.lookAt(0,0,25);camera.updateMatrixWorld(true);camera.updateProjectionMatrix();
              window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;window.__3DLiteGeometryRevision=(window.__3DLiteGeometryRevision||0)+1;RenderAccelerationCache16?.reset?.();LitePixCore2PartialCache415.reset();
              const sv=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};sv('rsEngine','path');sv('rsWidth',120);sv('rsHeight',68);sv('rsBounces',3);sv('rsMinSamples',1);sv('rsMaxSamples',2);sv('rsNoise',.05);sv('rsExposure',0);
              async function render(mode){window.__LitePixCore2Partial415Enabled=mode==='415';window.__LitePixCore2Persistent414Enabled=false;window.__LitePixCore2Scene413Enabled=true;window.__LitePixCore2Path412Enabled=true;if(mode==='413'){RenderAccelerationCache16?.reset?.();}const prior=RenderFramework?.jobs?.lastJob?.id||0,t=Date.now();document.getElementById('renderNowBtn').click();while(true){await new Promise(r=>setTimeout(r,40));const j=RenderFramework.jobs.lastJob;if(j&&j.id!==prior&&j.finished&&j.performance){const rgba=j.beautyFrame?.rgba||j.beautyFrame?.data||null;return{wallMs:Date.now()-t,performance:j.performance,secondaryGI:j.beautyFrame?.metadata?.secondaryGI||null,partial:j.beautyFrame?.metadata?.litePixCore2Partial||null,rgba:rgba?Array.from(rgba):null};}}}
              const first=await render('415');const entry=LitePixCore2PartialCache415.entry,ids=[...entry.inner.blasByKey.keys()],old0=entry.inner.blasByKey.get(ids[0]),old1=entry.inner.blasByKey.get(ids[1]);
              const pos=g0.attributes.position;pos.setX(0,pos.getX(0)-9);pos.needsUpdate=true;g0.computeVertexNormals();g0.computeBoundingBox();g0.computeBoundingSphere();window.__3DLiteGeometryRevision=(window.__3DLiteGeometryRevision||0)+1;window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;
              const partial=await render('415'),after=LitePixCore2PartialCache415.entry.inner,changedRebuilt=after.blasByKey.get(ids[0])!==old0,unchangedReused=after.blasByKey.get(ids[1])===old1;
              const fresh=await render('413');let maxPixelDiff=Infinity,meanPixelDiff=Infinity;if(partial.rgba&&fresh.rgba&&partial.rgba.length===fresh.rgba.length){let mx=0,sum=0;for(let i=0;i<partial.rgba.length;i++){const d=Math.abs(partial.rgba[i]-fresh.rgba[i]);if(d>mx)mx=d;sum+=d;}maxPixelDiff=mx;meanPixelDiff=sum/partial.rgba.length;}for(const x of [first,partial,fresh])delete x.rgba;
              return{identity:{title:document.title,version:window.LitePixVersion?.version,marker:window.__LitePixCore2Partial415===true},first,partial,fresh,changedRebuilt,unchangedReused,maxPixelDiff,meanPixelDiff,cache:LitePixCore2PartialCache415.snapshot()};
            });
            const f=[];if(response?.status()!==200)f.push('HTTP != 200');if(result.identity.version!=='4.15.0'||!result.identity.marker)f.push('v4.15 identity mismatch');if(result.first.partial?.cacheMode!=='rebuild')f.push('first render did not rebuild');if(result.partial.partial?.cacheMode!=='partial-blas')f.push('mesh edit did not partial-rebuild');if(result.partial.partial?.dirtyGeometry?.length!==1)f.push('expected one dirty geometry');if(!result.changedRebuilt)f.push('changed BLAS was not rebuilt');if(!result.unchangedReused)f.push('unchanged BLAS was not reused');if(!(result.partial.partial?.cache?.blasRebuilds===1&&result.partial.partial?.cache?.partialBLASUpdates===1&&result.partial.partial?.cache?.builds===1))f.push('partial cache counters wrong');if(result.partial.secondaryGI!=='Light Cache'||result.fresh.secondaryGI!=='Light Cache')f.push('Light Cache inactive');if(!(result.maxPixelDiff<=1&&result.meanPixelDiff<=0.02))f.push('partial/fresh parity failed '+result.maxPixelDiff+'/'+result.meanPixelDiff);if(pageErrors.length)f.push('page errors '+pageErrors.length);if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            const out={passed:!f.length,...result,pageErrors,consoleErrors,failures:f};console.log(JSON.stringify(out,null,2));await browser.close();if(f.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save report
        run: mkdir -p reports/litepix && cp /tmp/lp415.json reports/litepix/v4.15-partial-blas-report.json
      - name: Commit gated build
        run: |
          git config user.name 'LitePix v4.15 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html litepix/core2-instance-v4.13.js reports/litepix/v4.15-partial-blas-report.json
          git commit -m 'Gate LitePix v4.15 partial BLAS invalidation' || exit 0
          git push origin HEAD:litepix-v4.15-partial-blas