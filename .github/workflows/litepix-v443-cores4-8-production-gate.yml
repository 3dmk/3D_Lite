name: LitePix v4.43 Cores4-8 Production Gate
on:
  push:
    branches: [litepix-v4.24-v4.43-cores4-8-production]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Apply cumulative Cores4-8 production stages
        run: python3 patches/litepix/v4.43/apply-cores4-8-production.py
      - name: Structural and syntax release gate
        run: |
          set -euo pipefail
          node --check litepix/core4-production-v4.27.js
          node --check litepix/core5-production-v4.31.js
          node --check litepix/core6-production-v4.35.js
          node --check litepix/core7-production-v4.39.js
          node --check litepix/core8-production-v4.43.js
          node --check litepix/cores4-8-production-v4.43.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          req=['LitePix v4.43.0 All 8 Cores Production',"version:'4.43.0'",'core4-production-v4.27.js','core5-production-v4.31.js','core6-production-v4.35.js','core7-production-v4.39.js','core8-production-v4.43.js','cores4-8-production-v4.43.js','LitePixCores4to8Production443(width,height,job,compiled)','litePixCores4to8Production443.record(i,x,y,sample,ph,accumulator)','litePixCores4to8Production:job.litePixCores4to8Stats443','root.__3DLiteMaterialLinearColor3996=true;']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          ids=re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',s,re.I)
          if len(ids)!=len(set(ids)): raise SystemExit('duplicate ids found')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',s,re.I)
          if any(re.search(r'\bsrc\s*=',a) and b.strip() for a,b in scripts): raise SystemExit('external script inline body found')
          if len(re.findall(r'requestAnimationFrame\s*\(\s*animate\s*\)',s))!=1: raise SystemExit('animation loop owner mismatch')
          print('LitePix v4.43 structural gate passed')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser Cores4-8 production gate
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/lp443-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/lp443.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});await page.waitForTimeout(2500);
            const result=await page.evaluate(async()=>{
              const mat0=new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.65,metalness:0}),mat1=new THREE.MeshStandardMaterial({color:0x8aa8c2,roughness:.35,metalness:.15});
              const g0=new THREE.BoxGeometry(24,24,24),g1=new THREE.SphereGeometry(13,12,8),test=[];
              for(let i=0;i<14;i++){const m=new THREE.Mesh(i<7?g0:g1,i<7?mat0:mat1);m.name='LP443_'+i;m.position.set((i%7-3)*34,(Math.floor(i/7)-.5)*50,18+(i>=7?4:0));scene.add(m);objects.push(m);test.push(m);}
              camera.position.set(180,-230,140);camera.up.set(0,0,1);camera.lookAt(0,0,18);camera.updateMatrixWorld(true);camera.updateProjectionMatrix();window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;window.__3DLiteGeometryRevision=(window.__3DLiteGeometryRevision||0)+1;
              const sv=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};sv('rsEngine','path');sv('rsWidth',96);sv('rsHeight',54);sv('rsBounces',3);sv('rsMinSamples',1);sv('rsMaxSamples',2);sv('rsNoise',.05);sv('rsExposure',0);
              async function render(enabled){window.__LitePixCores4to8Production443Enabled=enabled;const prior=RenderFramework?.jobs?.lastJob?.id||0,t=Date.now();document.getElementById('renderNowBtn').click();while(true){await new Promise(r=>setTimeout(r,40));const j=RenderFramework.jobs.lastJob;if(j&&j.id!==prior&&j.finished&&j.performance){const rgba=j.beautyFrame?.rgba||j.beautyFrame?.data||null;return{wallMs:Date.now()-t,performance:j.performance,secondaryGI:j.beautyFrame?.metadata?.secondaryGI||null,core2:j.beautyFrame?.metadata?.litePixCore2Production||null,core3:j.beautyFrame?.metadata?.litePixCore3Production||null,c48:j.beautyFrame?.metadata?.litePixCores4to8Production||null,rgba:rgba?Array.from(rgba):null};}}}
              const on=await render(true),off=await render(false);let maxPixelDiff=Infinity,meanPixelDiff=Infinity;if(on.rgba&&off.rgba&&on.rgba.length===off.rgba.length){let mx=0,sum=0;for(let i=0;i<on.rgba.length;i++){const d=Math.abs(on.rgba[i]-off.rgba[i]);if(d>mx)mx=d;sum+=d;}maxPixelDiff=mx;meanPixelDiff=sum/on.rgba.length;}delete on.rgba;delete off.rgba;
              return{identity:{title:document.title,version:window.LitePixVersion?.version,m427:window.__LitePixCore4Production427===true,m431:window.__LitePixCore5Production431===true,m435:window.__LitePixCore6Production435===true,m439:window.__LitePixCore7Production439===true,m443:window.__LitePixCore8Production443===true,orch:window.__LitePixCores4to8Production443===true},on,off,maxPixelDiff,meanPixelDiff};
            });
            const f=[];if(response?.status()!==200)f.push('HTTP != 200');const id=result.identity;if(id.version!=='4.43.0'||!id.m427||!id.m431||!id.m435||!id.m439||!id.m443||!id.orch)f.push('production core identity mismatch');const p=result.on.c48;if(!p)f.push('Cores4-8 metadata missing');else{if(!(p.core4?.primaryHits>0&&p.core4?.cache?.records>0))f.push('Core4 GI/cache inactive');if(!(p.core5?.records>0&&p.core5?.temporal?.frames>0))f.push('Core5 reuse inactive');if(!(p.core6?.compiled>0&&p.core6?.preflight?.checked>0))f.push('Core6 material production inactive');if(p.core7?.state!=='done'||!(p.core7?.tiles?.tiles>0))f.push('Core7 production state inactive');if(!(p.core8?.telemetry?.frames>0))f.push('Core8 telemetry inactive');}
            if(!result.on.core2||!result.on.core3)f.push('Core2/Core3 production regression');if(result.on.secondaryGI!=='Light Cache'||result.off.secondaryGI!=='Light Cache')f.push('Light Cache inactive');if(!(result.maxPixelDiff<=1&&result.meanPixelDiff<=0.02))f.push('observer parity failed '+result.maxPixelDiff+'/'+result.meanPixelDiff);if(pageErrors.length)f.push('page errors '+pageErrors.length);if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            const out={passed:!f.length,...result,pageErrors,consoleErrors,failures:f};console.log(JSON.stringify(out,null,2));await browser.close();if(f.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save report
        run: mkdir -p reports/litepix && cp /tmp/lp443.json reports/litepix/v4.43-cores4-8-production-report.json
      - name: Commit gated build
        run: |
          git config user.name 'LitePix v4.43 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html reports/litepix/v4.43-cores4-8-production-report.json
          git commit -m 'Gate LitePix v4.43 all 8 cores production' || exit 0
          git push origin HEAD:litepix-v4.24-v4.43-cores4-8-production