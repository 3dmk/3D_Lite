name: LitePix v4.45 Adaptive Ray Budget Gate
on:
  push:
    branches: [litepix-v4.45-ray-budget]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Apply v4.45 integration
        run: python3 patches/litepix/v4.45/apply-ray-budget.py
      - name: Structural and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check litepix/core5-ray-budget-v4.45.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          req=['<title>3D Lite — LitePix v4.45.0 Adaptive Ray Budget</title>',"version:'4.45.0'",'core5-ray-budget-v4.45.js','job.litePixRayBudget445=litePixRayBudget445','const visible445=job.litePixRayBudget445','litePixRayBudget:job.litePixRayBudget445?.snapshot?.()||null']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          ids=re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']',s,re.I)
          if len(ids)!=len(set(ids)): raise SystemExit('duplicate ids found')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',s,re.I)
          if any(re.search(r'\bsrc\s*=',a) and b.strip() for a,b in scripts): raise SystemExit('external script inline body found')
          if len(re.findall(r'requestAnimationFrame\s*\(\s*animate\s*\)',s))!=1: raise SystemExit('animation loop owner mismatch')
          print('LitePix v4.45 structural gate passed')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser quality and ray-reduction gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/lp445-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE' | tee /tmp/lp445.json
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1280,height:900}}),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(async()=>{
              for(const o of [...objects]){try{scene.remove(o);}catch(_){}try{o.geometry?.dispose?.();}catch(_){}}
              objects.length=0;
              const floorMat=new THREE.MeshStandardMaterial({color:0x9a9a9a,roughness:.72,metalness:0});
              const boxMat=new THREE.MeshStandardMaterial({color:0xb86d43,roughness:.48,metalness:.03});
              const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,140,1,1),floorMat);floor.name='LP445_Floor';floor.position.set(0,0,0);scene.add(floor);objects.push(floor);
              const box=new THREE.Mesh(new THREE.BoxGeometry(34,34,34),boxMat);box.name='LP445_Blocker';box.position.set(0,0,17);scene.add(box);objects.push(box);
              if(!window.EditorLightSystem?.create)throw new Error('EditorLightSystem unavailable');
              const light=EditorLightSystem.create('point',{intensity:1600,color:'#ffffff',range:260,size:1,castShadows:true});
              light.name='LP445_Point';light.position.set(-38,-35,78);light.updateMatrixWorld(true);
              window.__3DLiteLightRevision=(window.__3DLiteLightRevision||0)+1;
              camera.position.set(105,-135,92);camera.up.set(0,0,1);camera.lookAt(0,0,12);camera.updateMatrixWorld(true);camera.updateProjectionMatrix();
              window.__3DLiteSceneRevision=(window.__3DLiteSceneRevision||0)+1;window.__3DLiteGeometryRevision=(window.__3DLiteGeometryRevision||0)+1;
              const val=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              const chk=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.checked=!!v;e.dispatchEvent(new Event('change',{bubbles:true}));};
              val('rsEngine','path');val('rsQuality','Preview');val('rsWidth',96);val('rsHeight',54);val('rsBounces',2);val('rsMinSamples',16);val('rsMaxSamples',16);val('rsNoise',0.001);val('rsExposure',0);val('rsEnvStrength',0);
              chk('rsGI',true);chk('rsProgressive',true);chk('rsAdaptive',false);chk('rsLightTree',true);chk('rsPathGuiding',false);
              const render=async enabled=>{
                window.__LitePixRayBudget445Enabled=enabled;
                const prior=RenderFramework?.jobs?.lastJob?.id||0;
                document.getElementById('renderNowBtn').click();
                let job=null;const deadline=performance.now()+120000;
                while(performance.now()<deadline){await new Promise(r=>setTimeout(r,30));const j=RenderFramework.jobs.lastJob;if(j&&j.id!==prior&&j.finished&&j.performance){job=j;break;}}
                if(!job)throw new Error('render timeout');
                const frame=job.beautyFrame,meta=frame?.metadata||{};
                return {rgba:Array.from(frame?.rgba||[]),budget:meta.litePixRayBudget||null,performance:meta.performance||job.performance||null,secondaryGI:meta.secondaryGI||null,core2:meta.litePixCore2Production||null,lights:job.renderScene?.lights||null};
              };
              const baseline=await render(false);
              const optimized=await render(true);
              const a=baseline.rgba,b=optimized.rgba;let se=0,ae=0,max=0,n=0;
              for(let i=0;i<Math.min(a.length,b.length);i+=4)for(let c=0;c<3;c++){const d=(a[i+c]-b[i+c])/255;se+=d*d;ae+=Math.abs(d);max=Math.max(max,Math.abs(d));n++;}
              const quality={rmse:Math.sqrt(se/Math.max(1,n)),meanAbs:ae/Math.max(1,n),maxAbs:max,pixels:Math.min(a.length,b.length)/4};
              return {identity:{title:document.title,version:window.LitePixVersion?.version,marker:window.__LitePixRayBudget445===true},baseline:{...baseline,rgba:undefined},optimized:{...optimized,rgba:undefined},quality};
            });
            const f=[];
            if(response?.status()!==200)f.push('HTTP != 200');
            if(result.identity.version!=='4.45.0'||!result.identity.marker||!result.identity.title.startsWith('3D Lite — LitePix v4.45.0'))f.push('identity mismatch');
            const b=result.baseline.budget,o=result.optimized.budget;
            if(!b||!o)f.push('ray budget metadata missing');
            if(b?.enabled!==false||o?.enabled!==true)f.push('feature toggle ownership failed');
            if(!(result.optimized.lights||[]).some(l=>l?.castShadows!==false))f.push('controlled render light missing or shadows disabled');
            if((b?.requestedShadowTests||0)<20000)f.push('controlled scene produced too few baseline shadow tests');
            if((o?.shadowReductionRatio||0)<6)f.push('shadow reduction below 6x');
            if((o?.tracedShadowRays||Infinity)>15000)f.push('optimized traced shadow rays above 15k target');
            if(result.quality.rmse>0.045||result.quality.meanAbs>0.018)f.push('quality regression beyond tolerance');
            if(result.optimized.secondaryGI!=='Light Cache')f.push('Light Cache inactive');
            if(pageErrors.length)f.push('page errors '+pageErrors.length);if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            const out={passed:!f.length,...result,pageErrors,consoleErrors,failures:f};console.log(JSON.stringify(out,null,2));await browser.close();if(f.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save stable gate report
        if: success()
        run: |
          mkdir -p reports/litepix
          if [ ! -f reports/litepix/v4.45-ray-budget-report.json ]; then cp /tmp/lp445.json reports/litepix/v4.45-ray-budget-report.json; fi
      - name: Commit gated build
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LitePix v4.45 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html reports/litepix/v4.45-ray-budget-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Gate 3D Lite LitePix v4.45 adaptive ray budget'
            git push origin HEAD:litepix-v4.45-ray-budget
          fi
