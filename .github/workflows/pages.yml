name: Deploy 3DLite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply 3DLite v3.99.9 renderer base update
        run: python3 patches/apply_gi_irradiance_lightcache_v3_99_8.py index.html
      - name: Apply 3DLite v3.99.10 fast first-light startup
        run: python3 patches/apply_render_start_v3_99_10.py index.html
      - name: Apply 3DLite v3.99.11 low-sample quality tuning
        run: python3 patches/apply_low_sample_quality_v3_99_11.py index.html
      - name: Apply 3DLite v3.99.12 guided denoiser
        run: python3 patches/apply_guided_denoiser_v3_99_12.py index.html
      - name: Apply 3DLite v3.99.13 live pass preview
        run: python3 patches/apply_live_pass_preview_v3_99_13.py index.html
      - name: Apply 3DLite v3.99.14 sparse global ray budget
        run: python3 patches/apply_sparse_global_ray_budget_v3_99_14.py index.html
      - name: Validate published renderer
        run: |
          grep -q '<option selected>Irradiance</option>' index.html
          grep -q '<option selected>Light Cache</option>' index.html
          grep -q "primaryGI='Irradiance'" index.html
          grep -q "Irradiance + Light Cache" index.html
          grep -q 'job.progress.inPassPercent' index.html
          grep -q 'job.progress.tracedPixels' index.html
          grep -q 'job.progress.percent=20+Math.round' index.html
          grep -q 'startupBatch16=pass===0?8' index.html
          grep -q "job.progress.status='Rendering first rays'" index.html
          grep -q 'job?.__renderPass16===0' index.html
          grep -q "(job?.__renderPass16||0)>0" index.html
          grep -q 'this.minSamples=2;this.maxSamples=8;this.noiseThreshold=.035' index.html
          grep -q "this.maxBounces=4;this.denoise='Quality'" index.html
          grep -q 'minSamples:2' index.html
          grep -q 'settings.noiseThreshold\*.75' index.html
          grep -q "process(channels,mode='Quality')" index.html
          grep -q 'Math.pow(nDot,normalPower)' index.html
          grep -q 'livePreview:true' index.html
          grep -q 'partialPass:true' index.html
          grep -q 'previewNow16-previewLastMs16>=120' index.html
          grep -q "version:'3.99.14-sparse-global-ray-budget'" index.html
          grep -q 'rayBudgetMin=1000' index.html
          grep -q 'rayBudgetMax=4000' index.html
          grep -q "rayBudgetMode='Sparse Adaptive Reconstruction'" index.html
          grep -q 'RenderSparseRayBudget39914.indices' index.html
          grep -q 'RenderSparseRayBudget39914.resolveRGBA' index.html
          grep -q '3.99.14' index.html
          ! grep -q '<option>Brute Force</option>' index.html
          ! grep -q 'job.progress.percent=96+Math.round(ratio\*4)' index.html
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const s=[...h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());for(const x of s)new Function(x);console.log('renderer inline JS syntax OK:',s.length)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
