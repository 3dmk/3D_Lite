name: Deploy 3DLite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply renderer release chain
        run: |
          python3 patches/releases/v3.99/apply_gi_irradiance_lightcache_v3_99_8.py index.html
          python3 patches/releases/v3.99/apply_render_start_v3_99_10.py index.html
          python3 patches/releases/v3.99/apply_low_sample_quality_v3_99_11.py index.html
          python3 patches/releases/v3.99/apply_guided_denoiser_v3_99_12.py index.html
          python3 patches/releases/v3.99/apply_live_pass_preview_v3_99_13.py index.html
          python3 patches/releases/v3.99/apply_sparse_global_ray_budget_v3_99_14.py index.html
          python3 patches/releases/v3.99/apply_default_render_scene_v3_99_15.py index.html
          python3 patches/releases/v3.99/apply_default_scene_postboot_v3_99_16.py index.html
          python3 patches/releases/v3.99/apply_default_scene_force_v3_99_17.py index.html
          python3 patches/releases/v3.99/apply_default_scene_camera_fix_v3_99_18.py index.html
          python3 patches/releases/v3.99/apply_default_scene_clean_v3_99_19.py index.html
          python3 patches/releases/v3.99/apply_default_scene_native_lights_v3_99_20.py index.html
          python3 patches/releases/v3.99/apply_scene_instances_panel_v3_99_22.py index.html
          python3 patches/releases/v3.99/apply_remove_l3n_debug_v3_99_23.py index.html
      - name: Validate published renderer and editor UI
        run: |
          grep -q '<option selected>Irradiance</option>' index.html
          grep -q '<option selected>Light Cache</option>' index.html
          grep -q "rayBudgetMin=1000" index.html
          grep -q "rayBudgetMax=4000" index.html
          grep -q "renderPreset='Fast Clean'" index.html
          grep -q 'defaultRenderScene39920' index.html
          grep -q "EditorLightSystem.create('rectangle'" index.html
          grep -q "EditorLightSystem.create('point'" index.html
          grep -q "EditorLightSystem.create('dome'" index.html
          grep -q 'sceneInstancesPanel39922' index.html
          grep -q 'Scene Instances' index.html
          grep -q 'removeL3NDebug39923' index.html
          grep -q '__3DLiteDebugLayerRemoved39923' index.html
          grep -q '3.99.23' index.html
          if grep -qi 'litepix/l3n-' index.html; then echo 'L3N runtime script still present'; exit 1; fi
          if grep -qi 'litepix/render-health-' index.html; then echo 'Render health runtime script still present'; exit 1; fi
          if grep -q 'render-health-bridge-v4.49.js' index.html; then echo 'Obsolete health bridge still present'; exit 1; fi
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const ids=[...h.matchAll(/id=\"([^\"]+)\"/g)].map(m=>m[1]);const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);if(dup.length)throw new Error('duplicate ids: '+[...new Set(dup)].join(','));const s=[...h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());for(const x of s)new Function(x);console.log('inline JS syntax and duplicate IDs OK:',s.length)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
