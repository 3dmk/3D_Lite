name: Deploy 3DLite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply 3DLite v3.99.8 GI renderer update
        run: python3 patches/apply_gi_irradiance_lightcache_v3_99_8.py index.html latest.html
      - name: Validate published renderer
        run: |
          grep -q '<option selected>Irradiance</option>' index.html
          grep -q '<option selected>Light Cache</option>' index.html
          grep -q "primaryGI='Irradiance'" index.html
          grep -q "Irradiance + Light Cache" index.html
          ! grep -q '<option>Brute Force</option>' index.html
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const s=[...h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());for(const x of s)new Function(x);console.log('renderer inline JS syntax OK:',s.length)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
