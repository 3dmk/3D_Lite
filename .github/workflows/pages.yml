name: Deploy 3DLite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative production snapshot
        uses: actions/checkout@v4

      - name: Sync production version label
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          h=h.replace("__3DLiteProductionVersion='4.49.4'","__3DLiteProductionVersion='4.49.5'")
          h=h.replace('3D Lite — LitePix v4.49.4 Production','3D Lite — LitePix v4.49.5 Production')
          sync='''\n<script id="visibleVersionSync495">\n(()=>{\n  const apply=()=>{\n    try{\n      document.title='3D Lite — LitePix v4.49.5 Production';\n      window.__3DLiteProductionVersion='4.49.5';\n      const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);\n      let n;\n      while((n=walker.nextNode())){\n        const t=n.nodeValue||'';\n        if(/3DLite\\s+4\\.45\\.0/i.test(t)) n.nodeValue=t.replace(/3DLite\\s+4\\.45\\.0/ig,'3DLite 4.49.5');\n      }\n    }catch(_){}\n  };\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',apply,{once:true}); else apply();\n  addEventListener('load',apply,{once:true});\n  setTimeout(apply,100); setTimeout(apply,500); setTimeout(apply,1500);\n})();\n</script>\n'''
          if 'visibleVersionSync495' not in h:
              h=h.replace('</body>',sync+'\n</body>',1)
          p.write_text(h,encoding='utf-8')
          PY

      - name: Validate clean production runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          h=Path('index.html').read_text(encoding='utf-8')
          required=['productionLayout494','productionRuntimeCleanup449',"__3DLiteProductionVersion='4.49.5'",'visibleVersionSync495','3DLite 4.49.5','Scene Instances','sceneInstancesPanel39922','sceneInstancesList39922']
          forbidden=['litepix/l3n-','litepix/render-health-','render-health-bridge-v4.49.js']
          missing=[x for x in required if x not in h]
          leftovers=[x for x in forbidden if x.lower() in h.lower()]
          ids=re.findall(r'id="([^"]+)"',h); dup=sorted({x for x in ids if ids.count(x)>1})
          print('missing:',missing); print('forbidden:',leftovers); print('duplicate_ids:',dup)
          if missing or leftovers or dup: sys.exit(1)
          PY
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const s=[...h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());for(const x of s)new Function(x);console.log('inline JS syntax OK:',s.length)"

      - name: Browser editor release gate
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8000 >/tmp/3dlite-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1600,height:900}});
            const pageErrors=[]; const consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(1800);
            try{await page.click('#createTabBtn');}catch(_){}
            await page.waitForTimeout(100);
            const createActive=await page.evaluate(()=>document.getElementById('createTabPage')?.classList.contains('active')===true);
            try{await page.click('#rotateBtn');}catch(_){}
            await page.waitForTimeout(100);
            const rotateActive=await page.evaluate(()=>document.getElementById('rotateBtn')?.classList.contains('active')===true);
            try{await page.click('#materialsTabBtn');}catch(_){}
            await page.waitForTimeout(100);
            const materialsActive=await page.evaluate(()=>document.getElementById('materialsTabPage')?.classList.contains('active')===true);
            const state=await page.evaluate(()=>{
              const panel=document.getElementById('sceneInstancesPanel39922');
              const list=document.getElementById('sceneInstancesList39922');
              const center=document.getElementById('center'); const workspace=document.getElementById('workspace');
              const pr=panel?.getBoundingClientRect(); const cr=center?.getBoundingClientRect(); const wr=workspace?.getBoundingClientRect();
              const canvases=[...document.querySelectorAll('#viewport canvas')];
              const canvasInfo=canvases.map(c=>{const r=c.getBoundingClientRect(),s=getComputedStyle(c);let gl=false;try{gl=!!(c.getContext('webgl2')||c.getContext('webgl'));}catch(_){}return{w:r.width,h:r.height,bw:c.width,bh:c.height,display:s.display,visibility:s.visibility,gl}});
              return {version:window.__3DLiteProductionVersion||null,prod:window.__3DLiteProductionRuntime449===true,text:document.body?.innerText||'',canvasInfo,workspaceVisible:!!workspace&&wr.width>700&&wr.height>400,centerVisible:!!center&&cr.width>300&&cr.height>250,scenePanelVisible:!!panel&&pr.width>100&&pr.height>100,sceneList:!!list,debugButtons:[...document.querySelectorAll('button')].filter(b=>/L3N Runtime|Copy Report|View Report|Render Debug/i.test(b.textContent||'')).map(b=>b.textContent)};
            });
            const failures=[];
            const workingCanvas=state.canvasInfo.some(c=>c.w>300&&c.h>200&&c.bw>1&&c.bh>1&&c.display!=='none'&&c.visibility!=='hidden'&&c.gl);
            if(response?.status()!==200)failures.push('HTTP '+response?.status());
            if(state.version!=='4.49.5'||!state.prod)failures.push('production v4.49.5 marker missing');
            if(!state.text.includes('3DLite 4.49.5'))failures.push('visible version label not v4.49.5');
            if(state.text.includes('3DLite 4.45.0'))failures.push('old visible version label remains');
            if(!state.workspaceVisible||!state.centerVisible)failures.push('editor layout not visible');
            if(!workingCanvas)failures.push('working WebGL viewport missing');
            if(!state.scenePanelVisible||!state.sceneList)failures.push('Scene Instances panel missing');
            if(state.debugButtons.length)failures.push('debug UI remains: '+state.debugButtons.join(', '));
            if(!createActive)failures.push('Create tab interaction failed');
            if(!rotateActive)failures.push('Rotate tool interaction failed');
            if(!materialsActive)failures.push('Materials tab interaction failed');
            if(/3DLite startup error/i.test(state.text))failures.push('startup error UI present');
            if(pageErrors.length)failures.push('page errors: '+pageErrors.join(' | '));
            console.log(JSON.stringify({passed:!failures.length,state,createActive,rotateActive,materialsActive,pageErrors,consoleErrors,failures},null,2));
            await browser.close(); if(failures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
