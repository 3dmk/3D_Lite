name: tmp v445 inspect
on:
  push:
    branches: [litepix-v4.45-ray-budget]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect renderer anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['const Group9DirectMIS=Object.freeze','var PathGIRenderer=Object.freeze','litePixCores4to8Production:','beautyFrame','core5-production-v4.31.js','<title>','const LitePixVersion=Object.freeze']
          for term in terms:
              print('\n===== TERM',term,'=====')
              start=0
              for count in range(1,8):
                  i=s.find(term,start)
                  if i<0: break
                  a=max(0,i-500);b=min(len(s),i+6000)
                  print(f'--- hit {count} at {i} ---')
                  print(s[a:b])
                  start=i+len(term)
          PY
