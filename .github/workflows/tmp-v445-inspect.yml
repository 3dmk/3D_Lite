name: tmp v445 inspect
on:
  push:
    branches: [litepix-v4.45-ray-budget]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect renderer anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['castShadows','castShadow','RenderSceneBoundary','light(obj','lights.push','type:\'point\'']
          for term in terms:
              print('\n===== TERM',term,'=====')
              start=0
              for count in range(1,12):
                  i=s.find(term,start)
                  if i<0: break
                  print(f'--- hit {count} at {i} ---')
                  print(s[max(0,i-1000):min(len(s),i+2600)])
                  start=i+len(term)
          PY
