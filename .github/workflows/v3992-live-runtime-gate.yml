name: v3.99.2 Live Pages Runtime Gate

on:
  push:
    branches: [v3.99.2-live-runtime-gate]
    paths:
      - '.github/workflows/v3992-live-runtime-gate.yml'

permissions:
  contents: read

jobs:
  live-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe live Fast renderer telemetry
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const consoleErrors=[]; const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            const response=await page.goto('https://3dmk.github.io/3D_Lite/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const pre=await page.evaluate(()=>{
              const exact='3DLite v3.99.0 L3N GitHub Runtime';
              const titleOwners=[...document.scripts].map((s,i)=>({i,id:s.id||null,text:s.src?'':s.textContent||''})).filter(s=>s.text.includes(exact)).map(s=>{const at=s.text.indexOf(exact);return {i:s.i,id:s.id,context:s.text.slice(Math.max(0,at-500),Math.min(s.text.length,at+exact.length+500))};});
              return {title:document.title,titleOwners,engine:document.getElementById('rsEngine')?.value,quality:document.getElementById('rsQuality')?.value,telemetry:window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()||null};
            });
            await page.evaluate(()=>{
              const set=(id,value)=>{const e=document.getElementById(id);if(!e)return;e.value=String(value);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              set('rsEngine','fast'); set('rsQuality','Preview'); set('rsWidth',160); set('rsHeight',90);
            });
            await page.locator('#renderNowBtn').click({timeout:30000});
            await page.waitForFunction(()=>{
              const j=window.RenderFramework?.jobs?.lastJob;
              return !!j && (!!j.finished || !!j.performance || !!window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()?.finalPerformance);
            },null,{timeout:120000,polling:250});
            await page.waitForTimeout(1000);
            const post=await page.evaluate(()=>{
              const j=window.RenderFramework?.jobs?.lastJob||null;
              const t=window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()||null;
              return {
                engine:document.getElementById('rsEngine')?.value,
                width:document.getElementById('rsWidth')?.value,
                height:document.getElementById('rsHeight')?.value,
                lastJob:j?{id:j.id||null,finished:!!j.finished,status:j.status||j.progress?.status||null,settings:j.settings||null,performance:j.performance||null,metadata:j.beautyFrame?.metadata||null}:null,
                telemetry:t
              };
            });
            console.log(JSON.stringify({httpStatus:response?.status(),pre,post,consoleErrors,pageErrors},null,2));
            const f=[]; const t=post.telemetry;
            if(response?.status()!==200)f.push('live HTTP status not 200');
            if(pre.engine!=='fast')f.push('initial renderer was not fast');
            if(post.engine!=='fast')f.push('renderer changed away from fast');
            if(!post.lastJob)f.push('no last render job');
            if(!post.lastJob?.finished)f.push('Fast render did not finish');
            if(!t?.fastDiagnostics)f.push('fastDiagnostics missing');
            if(!t?.rendererPerformance)f.push('rendererPerformance missing');
            if(!t?.finalPerformance)f.push('finalPerformance missing');
            if(!t?.workerStats)f.push('workerStats missing');
            if(t?.execution?.controllerHasLastJob!==true)f.push('controllerHasLastJob false');
            if(pageErrors.length)f.push('page errors='+pageErrors.length);
            if(f.length){console.error('FAST TELEMETRY GATE FAILED\n'+f.join('\n'));process.exitCode=1;}else console.log('FAST TELEMETRY GATE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
