name: v3.99.3 Live Pages Runtime Gate

on:
  push:
    branches: [v3.99.2-live-runtime-gate]
    paths:
      - '.github/workflows/v3992-live-runtime-gate.yml'

permissions:
  contents: read

jobs:
  live-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe deployed v3.99.3 Fast runtime
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            const response=await page.goto('https://3dmk.github.io/3D_Lite/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const pre=await page.evaluate(()=>({
              title:document.title,
              centralVersion:window.ThreeDLiteVersion?.version||null,
              appVersion:window.__3DLiteAppVersion||null,
              datasetAppVersion:document.documentElement.dataset.appVersion||null,
              telemetryVersion:window.ThreeDLiteLiteTraceTelemetry3992?.version||null,
              jobs:!!window.RenderFramework?.jobs,
              canvases:document.querySelectorAll('canvas').length,
              engine:document.getElementById('rsEngine')?.value
            }));
            await page.evaluate(()=>{
              const set=(id,value)=>{const e=document.getElementById(id);if(!e)return;e.value=String(value);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              set('rsEngine','fast');set('rsQuality','Preview');set('rsWidth',160);set('rsHeight',90);
              const b=document.getElementById('renderNowBtn');if(!b)throw new Error('renderNowBtn missing');b.click();
            });
            await page.waitForFunction(()=>{const j=window.RenderFramework?.jobs?.lastJob;return !!j&&(!!j.finished||!!j.performance);},null,{timeout:120000,polling:250});
            await page.waitForTimeout(500);
            const post=await page.evaluate(()=>({
              title:document.title,
              centralVersion:window.ThreeDLiteVersion?.version||null,
              appVersion:window.__3DLiteAppVersion||null,
              datasetAppVersion:document.documentElement.dataset.appVersion||null,
              lastJob:window.RenderFramework?.jobs?.lastJob?{finished:!!window.RenderFramework.jobs.lastJob.finished,status:window.RenderFramework.jobs.lastJob.status||window.RenderFramework.jobs.lastJob.progress?.status||null,metadata:window.RenderFramework.jobs.lastJob.beautyFrame?.metadata||null,performance:window.RenderFramework.jobs.lastJob.performance||null}:null,
              telemetry:window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()||null
            }));
            console.log(JSON.stringify({status:response?.status(),pre,post,consoleErrors,pageErrors},null,2));
            const f=[];
            if(response?.status()!==200)f.push('HTTP != 200');
            if(pre.title!=='3DLite v3.99.3 L3N GitHub Runtime'||post.title!=='3DLite v3.99.3 L3N GitHub Runtime')f.push('title mismatch');
            if(pre.centralVersion!=='3.99.3'||post.centralVersion!=='3.99.3')f.push('central version mismatch');
            if(pre.appVersion!=='3.99.3'||post.appVersion!=='3.99.3')f.push('public app version mismatch');
            if(pre.datasetAppVersion!=='3.99.3'||post.datasetAppVersion!=='3.99.3')f.push('dataset app version mismatch');
            if(!pre.jobs||pre.canvases<1)f.push('startup framework/viewport missing');
            if(!post.lastJob?.finished)f.push('Fast render not finished');
            if(post.telemetry?.renderer!=='Part 4 Fast Direct')f.push('Fast renderer telemetry mismatch');
            if(!post.telemetry?.fastDiagnostics||!post.telemetry?.rendererPerformance||!post.telemetry?.finalPerformance||!post.telemetry?.workerStats)f.push('telemetry incomplete');
            if(pageErrors.length)f.push('page errors='+pageErrors.length);
            if(consoleErrors.length)f.push('console errors='+consoleErrors.length);
            if(f.length){console.error('v3.99.3 LIVE GATE FAILED\n'+f.join('\n'));process.exitCode=1;}else console.log('v3.99.3 LIVE GATE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
