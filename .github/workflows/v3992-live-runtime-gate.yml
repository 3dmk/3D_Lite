name: v3.99.2 Live Pages Runtime Gate

on:
  push:
    branches: [v3.99.2-live-runtime-gate]
    paths:
      - '.github/workflows/v3992-live-runtime-gate.yml'

permissions:
  contents: read

jobs:
  live-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect deployed runtime title owner
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            const response=await page.goto('https://3dmk.github.io/3D_Lite/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const data=await page.evaluate(()=>{
              const scripts=[...document.scripts].map((s,i)=>({i,id:s.id||null,src:s.src||null,text:s.src?'':s.textContent||''}));
              const hits=scripts.filter(s=>/3DLite v3\.99\.0 L3N GitHub Runtime|document\.title|title\s*=/.test(s.text)).map(s=>({i:s.i,id:s.id,src:s.src,snippets:[...s.text.matchAll(/.{0,180}(?:3DLite v3\.99\.0 L3N GitHub Runtime|document\.title|title\s*=).{0,260}/gs)].slice(0,8).map(m=>m[0])}));
              return {title:document.title,htmlTitle:document.querySelector('title')?.textContent||null,hits,telemetry:window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()||null};
            });
            console.log(JSON.stringify({status:response?.status(),pageErrors,...data},null,2));
            if(pageErrors.length) process.exitCode=1;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
