name: v3.99.3 Local Runtime Gate
on:
  push:
    branches: [v3.99.3-version-sync-gate]
    paths:
      - '.github/workflows/v3993-local-runtime-gate.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run patched branch runtime gate
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/3dlite-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const pre=await page.evaluate(()=>({
              title:document.title,
              centralVersion:window.ThreeDLiteVersion?.version||null,
              appVersion:window.__3DLiteAppVersion||null,
              datasetAppVersion:document.documentElement.dataset.appVersion||null,
              telemetryMarker:window.__3DLiteLiteTraceTelemetry3992===true,
              telemetryVersion:window.ThreeDLiteLiteTraceTelemetry3992?.version||null,
              jobs:!!window.RenderFramework?.jobs,
              canvases:document.querySelectorAll('canvas').length,
              engine:document.getElementById('rsEngine')?.value
            }));
            await page.evaluate(()=>{
              const set=(id,value)=>{const e=document.getElementById(id);if(!e)return;e.value=String(value);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              set('rsEngine','fast'); set('rsQuality','Preview'); set('rsWidth',160); set('rsHeight',90);
              const b=document.getElementById('renderNowBtn');if(!b)throw new Error('renderNowBtn missing');b.click();
            });
            await page.waitForFunction(()=>{const j=window.RenderFramework?.jobs?.lastJob;return !!j&&(!!j.finished||!!j.performance);},null,{timeout:120000,polling:250});
            await page.waitForTimeout(500);
            const post=await page.evaluate(()=>({
              title:document.title,
              centralVersion:window.ThreeDLiteVersion?.version||null,
              appVersion:window.__3DLiteAppVersion||null,
              datasetAppVersion:document.documentElement.dataset.appVersion||null,
              lastJob:window.RenderFramework?.jobs?.lastJob?{finished:!!window.RenderFramework.jobs.lastJob.finished,settings:window.RenderFramework.jobs.lastJob.settings,performance:window.RenderFramework.jobs.lastJob.performance,metadata:window.RenderFramework.jobs.lastJob.beautyFrame?.metadata||null}:null,
              telemetry:window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()||null
            }));
            console.log(JSON.stringify({status:r?.status(),pre,post,pageErrors,consoleErrors},null,2));
            const f=[];
            if(r?.status()!==200)f.push('HTTP != 200');
            if(pre.title!=='3DLite v3.99.3 L3N GitHub Runtime')f.push('pre title mismatch');
            if(post.title!=='3DLite v3.99.3 L3N GitHub Runtime')f.push('post title mismatch');
            if(pre.centralVersion!=='3.99.3'||post.centralVersion!=='3.99.3')f.push('central version mismatch');
            if(pre.appVersion!=='3.99.3'||post.appVersion!=='3.99.3')f.push('public app version mismatch');
            if(pre.datasetAppVersion!=='3.99.3'||post.datasetAppVersion!=='3.99.3')f.push('dataset app version mismatch');
            if(!pre.telemetryMarker)f.push('telemetry marker missing');
            if(!pre.jobs||pre.canvases<1)f.push('startup viewport/framework missing');
            if(!post.lastJob?.finished)f.push('Fast render not finished');
            if(!post.telemetry?.fastDiagnostics||!post.telemetry?.rendererPerformance||!post.telemetry?.finalPerformance)f.push('Fast telemetry incomplete');
            if(pageErrors.length)f.push('page errors='+pageErrors.length);
            if(f.length){console.error('v3.99.3 LOCAL RUNTIME GATE FAILED\n'+f.join('\n'));process.exitCode=1;}else console.log('v3.99.3 LOCAL RUNTIME GATE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
