name: v3.99.3 Title Source Inspect
on:
  push:
    branches: [v3.99.2-live-runtime-gate]
    paths:
      - '.github/workflows/v3993-title-source-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate stale title/version ownership
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['L3N GitHub Runtime','GitHub Runtime','document.title','3.99.0','VERSION=\'3.99.0\'','version:\'3.99.0\'']
          for n in needles:
            print('\n###',n)
            start=0; count=0
            while True:
              i=s.find(n,start)
              if i<0: break
              count+=1
              line=s.count('\n',0,i)+1
              print(f'-- hit {count} line {line} --')
              print(s[max(0,i-500):min(len(s),i+len(n)+700)])
              start=i+len(n)
              if count>=20: break
            print('count shown',count)
          PY
