name: v3.99.4 GI Exact Inspect

on:
  push:
    branches: [v3.99.4-gi-telemetry-gate]
    paths:
      - '.github/workflows/v3994-gi-exact-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact GI settings and Path renderer regions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['rsPrimaryGI','rsSecondaryGI','primaryGI','secondaryGI','PathTracePart7Renderer','class PathTraceRenderEngine','RenderCoreH.performance(job)','performance?.ray(\'path\')']
          for n in needles:
              print('\n###',n)
              start=0; hits=0
              while True:
                  i=s.find(n,start)
                  if i<0: break
                  hits+=1
                  line=s.count('\n',0,i)+1
                  print(f'-- hit {hits} line {line} --')
                  print(s[max(0,i-1000):min(len(s),i+len(n)+2200)])
                  start=i+len(n)
                  if hits>=12: break
              print('hits',hits)
          PY
