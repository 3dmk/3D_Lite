name: v3.99.4 GI Telemetry Patch

on:
  push:
    branches: [v3.99.4-gi-telemetry-gate]
    paths:
      - '.github/workflows/v3994-gi-telemetry-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.99.4-gi-telemetry-gate
          fetch-depth: 0

      - name: Patch v3.99.4 GI telemetry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          pairs=[
            ("<title>3DLite v3.99.3 L3N GitHub Runtime</title>","<title>3DLite v3.99.4 L3N GitHub Runtime</title>"),
            ("const ThreeDLiteVersion=Object.freeze({name:'3DLite',version:'3.99.3'});","const ThreeDLiteVersion=Object.freeze({name:'3DLite',version:'3.99.4'});"),
            ("const VERSION='3.99.2';\nconst root=window;","const VERSION='3.99.4';\nconst root=window;")
          ]
          for old,new in pairs:
              if new not in s:
                  if s.count(old)!=1:
                      raise SystemExit(f'release-blocking anchor count {old[:70]!r}: {s.count(old)}')
                  s=s.replace(old,new,1)

          old="""  const rendererPerformance=metadata?.performance||null;
  const finalPerformance=job?.performance||null;
  const workerStats=jobs()?.workerStats?.()||null;"""
          new="""  const rendererPerformance=metadata?.performance||null;
  const finalPerformance=job?.performance||null;
  const giDiagnostics=job?.settings?.engine==='path' ? Object.freeze({
    renderer:metadata?.renderer||null,
    engine:'path',
    globalIllumination:job?.settings?.globalIllumination!==false,
    primaryGI:job?.settings?.primaryGI||null,
    secondaryGI:metadata?.secondaryGI||job?.settings?.secondaryGI||null,
    samplesPerPixel:Number(metadata?.samplesPerPixel)||0,
    passes:Number(metadata?.passes)||0,
    maxBounces:Number(metadata?.maxBounces)||Number(job?.settings?.maxBounces)||0,
    estimator:metadata?.estimator||null,
    mis:metadata?.mis===true,
    russianRoulette:metadata?.russianRoulette===true,
    importanceSampling:metadata?.importanceSampling||null,
    noise:Number.isFinite(Number(metadata?.noise))?Number(metadata.noise):null,
    transmission:metadata?.transmission===true,
    progressive:metadata?.progressive===true,
    adaptive:metadata?.adaptive===true,
    minSamples:Number(job?.settings?.minSamples)||0,
    maxSamples:Number(job?.settings?.maxSamples)||0,
    noiseThreshold:Number(job?.settings?.noiseThreshold)||0,
    lightCache:clone(metadata?.lightCache||null),
    emissiveTriangleLights:Number(metadata?.emissiveTriangleLights)||0,
    rendererDiagnostics:clone(metadata?.diagnostics||null),
    cameraRays:Number(rendererPerformance?.cameraRays)||0,
    pathRays:Number(rendererPerformance?.pathRays)||0,
    shadowRays:Number(rendererPerformance?.shadowRays)||0,
    probeRays:Number(rendererPerformance?.probeRays)||0,
    totalRays:Number(rendererPerformance?.totalRays)||0,
    samples:Number(rendererPerformance?.samples)||0,
    raysPerSecond:Number(rendererPerformance?.raysPerSecond)||0,
    stageMs:clone(rendererPerformance?.stageMs||null),
    pathGuiding:job?.settings?.pathGuiding===true,
    lightTree:job?.settings?.lightTree===true,
    acceleration:job?.settings?.acceleration||null
  }) : null;
  const workerStats=jobs()?.workerStats?.()||null;"""
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'release-blocking GI insertion anchor count={s.count(old)}')
              s=s.replace(old,new,1)

          old="""    fastDiagnostics:clone(fastDiagnostics),
    rendererPerformance:clone(rendererPerformance),"""
          new="""    fastDiagnostics:clone(fastDiagnostics),
    giDiagnostics:clone(giDiagnostics),
    rendererPerformance:clone(rendererPerformance),"""
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'release-blocking snapshot field anchor count={s.count(old)}')
              s=s.replace(old,new,1)

          old="root.ThreeDLiteLiteTraceTelemetry3992=Object.freeze({version:VERSION,snapshot,currentJob});"
          new="root.ThreeDLiteLiteTraceTelemetry3994=Object.freeze({version:VERSION,snapshot,currentJob});\nroot.ThreeDLiteLiteTraceTelemetry3992=root.ThreeDLiteLiteTraceTelemetry3994;"
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'release-blocking telemetry export anchor count={s.count(old)}')
              s=s.replace(old,new,1)

          old="root.__3DLiteLiteTraceTelemetry3992=true;"
          new="root.__3DLiteLiteTraceTelemetry3994=true;\nroot.__3DLiteLiteTraceTelemetry3992=true;"
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'release-blocking telemetry marker anchor count={s.count(old)}')
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Structural GI telemetry gate
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const f=[];
          const need=[
            "const ThreeDLiteVersion=Object.freeze({name:'3DLite',version:'3.99.4'});",
            '<title>3DLite v3.99.4 L3N GitHub Runtime</title>',
            "const VERSION='3.99.4';",
            "job?.settings?.engine==='path'",
            'giDiagnostics:clone(giDiagnostics)',
            'metadata?.samplesPerPixel',
            'metadata?.passes',
            'metadata?.maxBounces',
            'metadata?.lightCache',
            'metadata?.diagnostics',
            'rendererPerformance?.pathRays',
            'root.ThreeDLiteLiteTraceTelemetry3994',
            'root.ThreeDLiteLiteTraceTelemetry3992=root.ThreeDLiteLiteTraceTelemetry3994'
          ];
          for(const x of need)if(!h.includes(x))f.push('missing '+x);
          const ids=[...h.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(x=>x[1]);const seen=new Set(),dup=[];for(const id of ids){if(seen.has(id))dup.push(id);else seen.add(id)}if(dup.length)f.push('duplicate ids: '+[...new Set(dup)].join(','));
          const ext=[...h.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>/\bsrc\s*=/.test(m[1])&&(m[2]||'').trim());if(ext.length)f.push('external script inline bodies='+ext.length);
          const loops=(h.match(/requestAnimationFrame\s*\(\s*animate\s*\)/g)||[]).length;if(loops!==1)f.push('animation loop owners='+loops);
          if(f.length){console.error(f.join('\n'));process.exit(1)}
          console.log('v3.99.4 GI telemetry structural gate passed');
          NODE

      - name: Commit gated GI telemetry
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name '3DLite Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Gate 3DLite v3.99.4 GI telemetry'
          git push origin HEAD:v3.99.4-gi-telemetry-gate
