name: v3.99.4 Public Fast and GI Runtime Gate

on:
  push:
    branches: [v3.99.4-gi-telemetry-gate]
    paths:
      - '.github/workflows/v3994-public-dual-runtime-gate.yml'

permissions:
  contents: read

jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify deployed Fast and Path GI telemetry
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('https://3dmk.github.io/3D_Lite/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const startup=await page.evaluate(()=>({title:document.title,version:window.ThreeDLiteVersion?.version||null,appVersion:window.__3DLiteAppVersion||null,telemetryVersion:window.ThreeDLiteLiteTraceTelemetry3994?.version||null,legacyAliasSame:window.ThreeDLiteLiteTraceTelemetry3992===window.ThreeDLiteLiteTraceTelemetry3994,jobs:!!window.RenderFramework?.jobs,canvases:document.querySelectorAll('canvas').length}));
            const render=async(engine)=>{
              await page.evaluate(engine=>{
                const set=(id,value)=>{const e=document.getElementById(id);if(!e)return;e.value=String(value);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
                const check=(id,value)=>{const e=document.getElementById(id);if(!e)return;e.checked=!!value;e.dispatchEvent(new Event('change',{bubbles:true}));};
                set('rsEngine',engine);set('rsWidth',96);set('rsHeight',54);set('rsBounces',3);set('rsMinSamples',1);set('rsMaxSamples',4);set('rsNoise',0.1);set('rsSecondaryGI','Light Cache');check('rsGI',true);check('rsProgressive',true);check('rsAdaptive',true);
              },engine);
              const prior=await page.evaluate(()=>window.RenderFramework?.jobs?.lastJob?.id||0);
              await page.evaluate(()=>{const b=document.getElementById('renderNowBtn');if(!b)throw new Error('renderNowBtn missing');b.click();});
              await page.waitForFunction(prior=>{const j=window.RenderFramework?.jobs?.lastJob;return !!j&&j.id!==prior&&!!j.finished&&!!j.performance;},prior,{timeout:120000,polling:200});
              await page.waitForTimeout(300);
              return page.evaluate(()=>{const j=window.RenderFramework.jobs.lastJob;return {job:{finished:j.finished,settings:j.settings,metadata:j.beautyFrame?.metadata||null,performance:j.performance},telemetry:window.ThreeDLiteLiteTraceTelemetry3994.snapshot()};});
            };
            const fast=await render('fast');
            const path=await render('path');
            console.log(JSON.stringify({status:response?.status(),startup,fast,path,pageErrors,consoleErrors},null,2));
            const f=[];
            if(response?.status()!==200)f.push('HTTP != 200');
            if(startup.title!=='3DLite v3.99.4 L3N GitHub Runtime')f.push('title mismatch');
            if(startup.version!=='3.99.4'||startup.appVersion!=='3.99.4'||startup.telemetryVersion!=='3.99.4')f.push('version mismatch');
            if(!startup.legacyAliasSame||!startup.jobs||startup.canvases<1)f.push('startup compatibility/framework failure');
            if(!fast.job.finished||fast.job.settings.engine!=='fast'||!fast.telemetry.fastDiagnostics||fast.telemetry.giDiagnostics!==null)f.push('Fast telemetry failure');
            if(!path.job.finished||path.job.settings.engine!=='path'||path.telemetry.fastDiagnostics!==null||!path.telemetry.giDiagnostics)f.push('Path telemetry failure');
            const gi=path.telemetry.giDiagnostics;
            if(gi?.primaryGI!=='Brute Force'||gi?.secondaryGI!=='Light Cache'||gi?.maxBounces!==3||gi?.mis!==true||gi?.russianRoulette!==true)f.push('GI diagnostic values mismatch');
            if(!path.telemetry.rendererPerformance||!path.telemetry.finalPerformance)f.push('Path performance telemetry missing');
            if(pageErrors.length||consoleErrors.length)f.push(`runtime errors page=${pageErrors.length} console=${consoleErrors.length}`);
            if(f.length){console.error('v3.99.4 PUBLIC DUAL RUNTIME GATE FAILED\n'+f.join('\n'));process.exitCode=1;}else console.log('v3.99.4 PUBLIC DUAL RUNTIME GATE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
