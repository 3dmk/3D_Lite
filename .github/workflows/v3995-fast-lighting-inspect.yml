name: v3.99.5 Fast Lighting Inspect

on:
  push:
    branches: [v3.99.5-fast-direct-lighting-fix]
    paths:
      - '.github/workflows/v3995-fast-lighting-inspect.yml'
      - 'patches/v3.99.5/inspect-fast-lighting.py'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.99.5-fast-direct-lighting-fix
          fetch-depth: 0
      - name: Capture exact Fast Direct lighting code
        run: python3 patches/v3.99.5/inspect-fast-lighting.py
      - name: Commit inspection output
        shell: bash
        run: |
          git config user.name '3DLite Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add patches/v3.99.5/fast-lighting-inspection.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture v3.99.5 Fast lighting source inspection'
          git push origin HEAD:v3.99.5-fast-direct-lighting-fix
