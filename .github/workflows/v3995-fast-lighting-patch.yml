name: v3.99.5 Fast Direct Lighting Patch

on:
  push:
    branches: [v3.99.5-fast-direct-lighting-fix]
    paths:
      - '.github/workflows/v3995-fast-lighting-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.99.5-fast-direct-lighting-fix
          fetch-depth: 0
      - name: Apply Fast Direct lighting fix
        run: python3 patches/v3.99.5/fast-direct-lighting-fix.py
      - name: Structural release gate
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const failures=[];
          for(const x of [
            '<title>3DLite v3.99.5 L3N GitHub Runtime</title>',
            "const ThreeDLiteVersion=Object.freeze({name:'3DLite',version:'3.99.5'});",
            "const VERSION='3.99.5';",
            'const faceNormal=hit.orientedGeometricNormal||hit.geometricNormal||[0,0,1];',
            'if(RayMath.dot(n,faceNormal)<0)n=RayMath.mul(n,-1);',
            'window.__3DLiteFastDirectLighting3995=true;'
          ]) if(!h.includes(x)) failures.push('missing '+x);
          const ids=[...h.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]);
          const seen=new Set(),dups=[]; for(const id of ids){if(seen.has(id))dups.push(id); else seen.add(id)}
          if(dups.length) failures.push('duplicate ids '+[...new Set(dups)].join(','));
          const ext=[...h.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>/\bsrc\s*=/.test(m[1])&&(m[2]||'').trim());
          if(ext.length) failures.push('external script inline bodies '+ext.length);
          const loops=(h.match(/requestAnimationFrame\s*\(\s*animate\s*\)/g)||[]).length;
          if(loops!==1) failures.push('animation loop owners '+loops);
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('v3.99.5 structural gate passed');
          NODE
      - name: Commit gated update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name '3DLite Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Gate 3DLite v3.99.5 Fast Direct lighting fix'
          git push origin HEAD:v3.99.5-fast-direct-lighting-fix
