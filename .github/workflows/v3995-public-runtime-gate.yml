name: v3.99.5 Public Runtime Gate

on:
  push:
    branches: [v3.99.5-fast-direct-lighting-fix]
    paths:
      - '.github/workflows/v3995-public-runtime-gate.yml'

permissions:
  contents: read

jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify deployed v3.99.5 lighting fix
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('https://3dmk.github.io/3D_Lite/?v=3995',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const core=await page.evaluate(()=>{
              const store={positions:new Float32Array([-1,-1,0,1,-1,0,0,1,0]),normals:new Float32Array([0,0,1,0,0,1,0,0,1]),triangles:new Uint32Array([0,1,2])};
              const hit={triangleIndex:0,u:.25,v:.25,geometricNormal:[0,0,1],orientedGeometricNormal:[0,0,-1]};
              const n=SurfaceInterpolator.normal({store},hit);
              const light=new RenderSceneLight({id:'reg-spot',name:'Regression Spot',type:'spot',enabled:true,color:'#ffffff',intensity:10,range:100,size:1,width:1,height:1,coneAngle:45,penumbra:.2,castShadows:false,position:[0,0,-10],direction:[0,0,1]});
              const sample=DirectLightSampler.sample(light,[0,0,0]);
              const mat=new RenderSurfaceMaterial({id:'reg-mat',name:'Regression',shading:'physical',baseColor:[.8,.4,.2],roughness:.5,metalness:0,opacity:1,emissive:[0,0,0],emissiveIntensity:0});
              const brdf=PhysicalBSDF.evaluate(mat,n,[0,0,-1],sample.direction);
              return {title:document.title,version:window.ThreeDLiteVersion?.version||null,marker:window.__3DLiteFastDirectLighting3995===true,normal:n,radiance:sample.radiance,litEnergy:brdf.reduce((a,b)=>a+b,0)*sample.radiance.reduce((a,b)=>a+b,0)};
            });
            const set=engine=>page.evaluate(engine=>{const sv=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};sv('rsEngine',engine);sv('rsWidth',96);sv('rsHeight',54);sv('rsBounces',2);sv('rsMinSamples',1);sv('rsMaxSamples',2);sv('rsNoise',.2);},engine);
            const render=async engine=>{await set(engine);const prior=await page.evaluate(()=>window.RenderFramework?.jobs?.lastJob?.id||0);await page.evaluate(()=>document.getElementById('renderNowBtn').click());await page.waitForFunction(prior=>{const j=window.RenderFramework?.jobs?.lastJob;return !!j&&j.id!==prior&&j.finished&&j.performance;},prior,{timeout:120000,polling:200});return page.evaluate(()=>({engine:window.RenderFramework.jobs.lastJob.settings.engine,renderer:window.RenderFramework.jobs.lastJob.beautyFrame?.metadata?.renderer||null,telemetry:window.ThreeDLiteLiteTraceTelemetry3994?.snapshot?.()||window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()||null}));};
            const fast=await render('fast');
            const path=await render('path');
            console.log(JSON.stringify({status:response?.status(),core,fast,path,pageErrors,consoleErrors},null,2));
            const f=[];
            if(response?.status()!==200)f.push('HTTP != 200');
            if(core.title!=='3DLite v3.99.5 L3N GitHub Runtime'||core.version!=='3.99.5'||!core.marker)f.push('public version/marker mismatch');
            if(core.normal[2]>-.999)f.push('public oriented normal regression');
            if(core.radiance.every(v=>!(v>0))||!(core.litEnergy>0))f.push('public direct lighting black');
            if(fast.engine!=='fast'||fast.renderer!=='Part 4 Fast Direct'||!fast.telemetry?.fastDiagnostics)f.push('public Fast render failed');
            if(path.engine!=='path'||!String(path.renderer||'').includes('Path GI')||!path.telemetry?.giDiagnostics)f.push('public Path/GI render failed');
            if(pageErrors.length)f.push('page errors '+pageErrors.length);
            if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            if(f.length){console.error('v3.99.5 PUBLIC RUNTIME GATE FAILED\n'+f.join('\n'));process.exitCode=1;}else console.log('v3.99.5 PUBLIC RUNTIME GATE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
