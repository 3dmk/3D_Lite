name: v3.99.6 Dark GI Inspect

on:
  push:
    branches: [v3.99.6-dark-gi-lighting-fix]
    paths:
      - '.github/workflows/v3996-dark-gi-inspect.yml'
      - 'patches/v3.99.6/inspect-dark-gi.py'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.99.6-dark-gi-lighting-fix
          fetch-depth: 0
      - name: Capture GI lighting code
        run: python3 patches/v3.99.6/inspect-dark-gi.py
      - name: Commit inspection output
        shell: bash
        run: |
          git config user.name '3DLite Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add patches/v3.99.6/dark-gi-inspection.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture v3.99.6 dark GI lighting inspection'
          git push origin HEAD:v3.99.6-dark-gi-lighting-fix
