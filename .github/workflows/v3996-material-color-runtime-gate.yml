name: v3.99.6 Material Color Runtime Gate

on:
  push:
    branches: [v3.99.6-dark-gi-lighting-fix]
    paths:
      - '.github/workflows/v3996-material-color-runtime-gate.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify material color and renderer behavior
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/3dlite-v3996-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const core=await page.evaluate(()=>{
              const source=new THREE.MeshStandardMaterial({color:'#808080',emissive:'#202020',roughness:.5,metalness:0});
              const snap=RenderSceneBoundary.material(source);
              const compiled=new RenderSurfaceMaterial(snap);
              const legacy=new RenderSurfaceMaterial({id:'legacy',baseColor:[.5,.5,.5],roughness:.5,metalness:0,opacity:1,emissive:[0,0,0],emissiveIntensity:0});
              const legacyExpected=RenderColor.srgbToLinear([.5,.5,.5]);
              const spot=new RenderSceneLight({id:'spot',name:'spot',type:'spot',enabled:true,color:'#ffffff',intensity:10,range:100,size:1,width:1,height:1,coneAngle:45,penumbra:.2,castShadows:false,position:[0,0,10],direction:[0,0,-1]});
              const sample=DirectLightSampler.sample(spot,[0,0,0]);
              const brdf=PhysicalBSDF.evaluate(compiled,[0,0,1],[0,0,1],sample.direction);
              const energy=brdf.reduce((a,b)=>a+b,0)*sample.radiance.reduce((a,b)=>a+b,0);
              return {
                title:document.title,
                version:window.ThreeDLiteVersion?.version||null,
                marker:window.__3DLiteMaterialLinearColor3996===true,
                snapshotColorSpace:snap.colorSpace||null,
                sourceColor:[source.color.r,source.color.g,source.color.b],
                compiledColor:compiled.baseColor,
                legacyColor:legacy.baseColor,
                legacyExpected,
                directEnergy:energy
              };
            });
            const set=engine=>page.evaluate(engine=>{
              const setv=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
              setv('rsEngine',engine);setv('rsWidth',96);setv('rsHeight',54);setv('rsBounces',3);setv('rsMinSamples',1);setv('rsMaxSamples',2);setv('rsNoise',.2);setv('rsExposure',0);
            },engine);
            const render=async engine=>{await set(engine);const prior=await page.evaluate(()=>window.RenderFramework?.jobs?.lastJob?.id||0);await page.evaluate(()=>document.getElementById('renderNowBtn').click());await page.waitForFunction(prior=>{const j=window.RenderFramework?.jobs?.lastJob;return !!j&&j.id!==prior&&j.finished&&j.performance;},prior,{timeout:120000,polling:200});return page.evaluate(()=>({job:window.RenderFramework.jobs.lastJob,telemetry:window.ThreeDLiteLiteTraceTelemetry3994?.snapshot?.()||window.ThreeDLiteLiteTraceTelemetry3992?.snapshot?.()||null}));};
            const fast=await render('fast');
            const path=await render('path');
            const fastRenderer=fast.job.beautyFrame?.metadata?.renderer||null;
            const pathRenderer=path.job.beautyFrame?.metadata?.renderer||null;
            const f=[];
            if(response?.status()!==200)f.push('HTTP != 200');
            if(core.title!=='3DLite v3.99.6 L3N GitHub Runtime'||core.version!=='3.99.6'||!core.marker)f.push('version/marker mismatch');
            if(core.snapshotColorSpace!=='linear')f.push('snapshot color space not linear');
            const maxDiff=(a,b)=>Math.max(...a.map((v,i)=>Math.abs(v-b[i])));
            if(maxDiff(core.sourceColor,core.compiledColor)>1e-7)f.push('Three.js linear material was altered');
            if(maxDiff(core.legacyColor,core.legacyExpected)>1e-7)f.push('legacy sRGB compatibility failed');
            if(!(core.directEnergy>0))f.push('direct lighting energy is black');
            if(fast.job.settings.engine!=='fast'||fastRenderer!=='Part 4 Fast Direct'||!fast.telemetry?.fastDiagnostics)f.push('Fast smoke failed');
            if(path.job.settings.engine!=='path'||!String(pathRenderer||'').includes('Path GI')||!path.telemetry?.giDiagnostics)f.push('Path/GI smoke failed');
            if(path.telemetry?.giDiagnostics?.secondaryGI!=='Light Cache')f.push('Light Cache not active');
            if(pageErrors.length)f.push('page errors '+pageErrors.length);
            if(consoleErrors.length)f.push('console errors '+consoleErrors.length);
            console.log(JSON.stringify({core,fast:{renderer:fastRenderer,telemetry:fast.telemetry},path:{renderer:pathRenderer,telemetry:path.telemetry},pageErrors,consoleErrors,failures:f},null,2));
            if(f.length){console.error('v3.99.6 RUNTIME GATE FAILED\n'+f.join('\n'));process.exitCode=1;}else console.log('v3.99.6 RUNTIME GATE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
