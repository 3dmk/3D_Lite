<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Lite Clean Rewrite</title>
<style>
:root{--bg:#202020;--panel:#292929;--line:#3f3f3f;--text:#dedede;--muted:#999;--accent:#ff8a00}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px/1.4 "Segoe UI",Arial,sans-serif}
body{display:grid;grid-template-rows:36px 1fr 24px}.top{display:flex;align-items:center;gap:8px;padding:0 10px;background:#252525;border-bottom:1px solid var(--line)}
.brand{font-weight:600}.tag{color:var(--muted)}button{background:#353535;color:var(--text);border:1px solid #4a4a4a;border-radius:3px;padding:5px 9px}button:hover{border-color:#666}
main{display:grid;grid-template-columns:1fr 320px;min-height:0}.viewport-wrap{min-width:0;min-height:0}#viewport{width:100%;height:100%;display:block}.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.side h3{margin:0;padding:10px;border-bottom:1px solid var(--line);font-size:12px}.side pre{margin:0;padding:10px;overflow:auto;white-space:pre-wrap;color:#bbb}.status{display:flex;align-items:center;padding:0 10px;background:#252525;border-top:1px solid var(--line);color:#aaa}.accent{color:var(--accent)}
</style>
</head>
<body>
<header class="top"><span class="brand">3D Lite</span><span class="tag">Clean Rewrite • L3N/DCAMP foundation</span><button id="rename">Rename Scene</button><button id="move">Move Object</button></header>
<main><section class="viewport-wrap"><canvas id="viewport"></canvas></section><aside class="side"><h3>Main Core State</h3><pre id="core-output"></pre></aside></main>
<footer class="status" id="status">Booting Main Core…</footer>
<script type="module" src="./src/app/bootstrap.mjs"></script>
</body>
</html>
